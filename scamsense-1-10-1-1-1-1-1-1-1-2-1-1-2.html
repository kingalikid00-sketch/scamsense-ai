<!DOCTYPE html>

<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('scamsense-theme')==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
html,body{margin:0;background:#020617;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#EAF0FF}
*{box-sizing:border-box}
button{font-family:inherit}
button,input,select{outline:none;-webkit-tap-highlight-color:transparent}
button:focus,button:focus-visible,input:focus,input:focus-visible{outline:none;box-shadow:none}
svg{vertical-align:-0.15em;flex:none}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#040A1C 0%,#071233 100%);font-size:16px;line-height:1.5;position:relative;overflow:hidden}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:12px;min-height:64px;flex:none}
#main{flex:1;overflow-y:auto;padding:0 4% 12px;-webkit-overflow-scrolling:touch}
#dock{flex:none;padding:6px 4% calc(14px + env(safe-area-inset-bottom))}
.ib{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:#EAF0FF;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.ib:hover{background:#13224A}
.pill{width:100%;text-align:left;background:#0E1A3C;border:1px solid #1A2A55;border-radius:32px;padding:8px 14px 8px 8px;display:flex;gap:14px;align-items:center;color:#EAF0FF;cursor:pointer;min-height:clamp(50px,7.4vh,60px);margin:0 0 clamp(6px,1.3vh,10px);font-size:17px;max-width:500px}
.pill:hover{border-color:#2E7BFF;background:#11214A}
.circ{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:none}
.row{width:100%;text-align:left;background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;color:#EAF0FF;cursor:pointer;min-height:64px;margin:0 0 10px;font-size:16px}
.row:hover{border-color:#2E7BFF}
.rt{font-size:16px;font-weight:500;line-height:1.3}
.rs{font-size:14px;color:#8FA0C8;line-height:1.4;margin-top:2px}
.h{font-size:13px;font-weight:600;color:#3DF0D0;margin:12px 0 4px}
.tag{font-size:11px;font-weight:600;border-radius:8px;padding:2px 8px;background:#3A2E12;color:#F5C56B;margin-left:6px;white-space:nowrap}
.chip{border:1px solid #2A3F78;background:transparent;color:#C9D6F5;border-radius:20px;padding:0 14px;height:40px;font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip:hover{border-color:#3DF0D0}
.btn{height:42px;border-radius:12px;border:none;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
.inp{flex:1;min-width:0;height:44px;background:transparent;border:none;color:#EAF0FF;font-size:16px;outline:none;padding:0 6px;font-family:inherit}
.inp::placeholder{color:#7F8FC0}
.dots i{width:7px;height:7px;border-radius:50%;background:#7F9BFF;display:inline-block;margin-right:4px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.ul{margin:0 0 8px;padding-left:20px}.ul li{margin:3px 0}
code{background:#16264F;border-radius:6px;padding:1px 6px;font-size:14px}
.rec{background:#EF4444 !important;color:#fff !important;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}
@media (max-height:760px){.mascot{transform:scale(.7)}}
.ai{flex:1;min-width:0;border-radius:4px 18px 18px 18px;padding:12px 14px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.card{background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:14px;margin:0 0 14px}
.demo{border:1px dashed #6B5A22;background:#1C1808;border-radius:12px;padding:8px 12px;font-size:13px;color:#F5C56B}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#3A1226,#1E1440);border:1px solid #6B2440;border-radius:16px;padding:12px 14px;margin:0 0 14px;color:#FFD0D0;font-size:15px;line-height:1.45}
.warnbox svg{color:#FF8A8A;margin-top:2px}
.prim{width:100%;height:54px;border-radius:27px;border:none;background:#14D3B0;color:#04222A;font-size:17px;font-weight:600;cursor:pointer;margin:0 0 12px}
.prim:disabled{opacity:.4;cursor:not-allowed}
.sec{width:100%;height:48px;border-radius:24px;border:1px solid #2A3F78;background:transparent;color:#C9D6F5;font-size:16px;font-weight:500;cursor:pointer;margin:0 0 10px}
.sec:hover{border-color:#3DF0D0}
.fld{width:100%;background:#0B1738;border:1px solid #2A3F78;border-radius:16px;color:#EAF0FF;font-size:16px;font-family:inherit;padding:12px 14px;margin:0 0 12px}
.fld::placeholder{color:#7F8FC0}
textarea{outline:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #1A2A55;font-size:15px}
.kv span:first-child{color:#8FA0C8;flex:none}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:#13224A;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E7BFF,#3DF0D0);transition:width .4s}
.stp{display:flex;align-items:center;gap:12px;padding:8px 0;color:#8FA0C8}
.stp.now{color:#EAF0FF}.stp.done{color:#C9D6F5}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid #2A3F78;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.dot.ok{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #2A3F78;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;margin-top:2px}
.box.on{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.thr{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.th{position:relative;width:96px;height:96px;border-radius:16px;background:#0E1A3C;border:1px solid #1A2A55;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.th img{width:100%;height:100%;object-fit:cover}
.th .ib{position:absolute;top:2px;right:2px;width:30px;height:30px;font-size:16px;background:rgba(2,6,23,.7)}
.th.add{flex-direction:column;gap:4px;color:#8FA0C8;cursor:pointer;border:1px dashed #2A3F78;font-size:13px;font-family:inherit}
.th.add:hover{border-color:#3DF0D0}
.vf{width:200px;height:200px;border-radius:50%;border:2px dashed #3DF0D0;display:flex;align-items:center;justify-content:center;background:#0B1738}

/* ===== HOME SCREEN (ChatGPT-style) ===== */
.hm{min-height:100%;display:flex;flex-direction:column;align-items:center}
.hm-top{flex:1 1 0;min-height:16px}
.hm-intro{flex:none;text-align:center;padding:0 6px 4px;display:flex;flex-direction:column;align-items:center}
.hm-intro .t{font-size:clamp(19px,5.2vw,23px);font-weight:600;line-height:1.3}
.hm-intro .s{font-size:15px;color:#8FA0FF;margin:8px 0 0;max-width:320px;line-height:1.4}
.hm-list{flex:1.7 1 0;min-height:150px;width:100%;max-width:500px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 0 30px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent)}
.hm-list::-webkit-scrollbar{display:none}
.hm-list .pill{flex:none;min-height:54px;margin:0 0 6px;padding-top:6px;padding-bottom:6px}
.hm-list{padding-top:8px}
/* ===== THEME CONTROL (in menu) ===== */
.thm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.thm .seg{display:flex;gap:4px;background:#0B1738;border:1px solid #2A3F78;border-radius:22px;padding:3px}
.thm .seg button{border:none;background:transparent;color:#C9D6F5;border-radius:18px;height:36px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer}
.thm .seg button.on{background:#14D3B0;color:#04222A}

/* ===== LIGHT MODE (applies only when html[data-theme=light]; dark stays the default) ===== */
html[data-theme=light]{color-scheme:light}
html[data-theme=light],html[data-theme=light] body{background:#F4F7FC;color:#0F1A33}

html[data-theme=light] .pill:hover,html[data-theme=light] .row:hover{background:#F1F6FF;border-color:#2E7BFF}

/* ===== TRUSTCHECK labels ===== */
.tcchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.tc-fact{background:#13224A;color:#9DBBFF}
.tc-ai{background:#2A1E5C;color:#C9B8FF}
.tc-unk{background:#232B45;color:#C9D6F5}
.tc-match{background:#3A2E12;color:#F5C56B}
html[data-theme=light] .tc-fact{background:#DCE8FF;color:#2A55C8}
html[data-theme=light] .tc-ai{background:#EADFFF;color:#5B3FC0}
html[data-theme=light] .tc-unk{background:#E6EAF3;color:#3A4A70}

.ec{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.ec-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 2px}
.ec-s{font-size:13px;color:#8FA0C8;line-height:1.4;margin:0 0 8px}
.ec-c{border-top:1px dashed #1A2A55;padding:8px 0}
.ec-c:first-of-type{border-top:0}
.ec-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8FA0C8;margin:0}
.ec-v{font-size:14px;line-height:1.4;color:#EAF0FF;margin:1px 0 0}
.ec-a{font-size:14px;color:#5A6A99;margin:1px 0 1px 4px;line-height:1}
.ec-st{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:2px 9px;margin-top:2px}
.ec-verified{background:#0B3A36;color:#3DF0D0}
.ec-partial{background:#3A2E12;color:#F5C56B}
.ec-unverified{background:#232B45;color:#C9D6F5}
.ec-conflict{background:#4A1D24;color:#FF8A8A}
.ec-unknown{background:#232B45;color:#9DBBFF}
html[data-theme=light] .ec{background:#F3F6FD;border-color:#CFD9F0}
html[data-theme=light] .ec-t,html[data-theme=light] .ec-v{color:#0F1E45}
html[data-theme=light] .ec-s,html[data-theme=light] .ec-k{color:#4A5B85}
html[data-theme=light] .ec-c{border-top-color:#D5DEF2}

html[data-theme=light] .ec-partial{background:#FFF1CC;color:#8A6100}

html[data-theme=light] .ec-conflict{background:#FFE0E0;color:#A12A2A}
.pmap{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.pmap-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 2px}
.pmap-s{font-size:13px;color:#8FA0C8;line-height:1.4;margin:0 0 8px}
.pm-step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative}
.pm-step+.pm-step{border-top:1px dashed #1A2A55}
.pm-dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.pm-said .pm-dot{background:#F5C56B;color:#231A04}
.pm-miss .pm-dot{background:transparent;border:2px dashed #5A6A99;color:#9DBBFF}
.pm-here .pm-dot{background:#3DF0D0;color:#04222A}
.pm-l{font-size:15px;line-height:1.35;font-weight:600}
.pm-miss .pm-l{font-weight:500;color:#C9D6F5}
.pm-n{font-size:13.5px;line-height:1.4;color:#B7C5E8;margin-top:2px}
.pm-st{font-size:12.5px;line-height:1.35;color:#8FA0C8;margin-top:2px}
.pm-you{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:1px;background:#0B3A36;color:#3DF0D0;white-space:nowrap}
.pmap-key{font-size:12.5px;line-height:1.45;color:#8FA0C8;margin:8px 0 0}

/* ===== PRESSURE METER ===== */
.pmeter{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.pmeter-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 6px}

.pmeter-d{font-size:14.5px;line-height:1.45;color:#C9D6F5;margin:0 0 6px}

.pmeter-tip{font-size:13.5px;line-height:1.45;color:#C9D6F5;margin:8px 0 0}
.pmeter-care{font-size:13.5px;line-height:1.45;color:#C9D6F5;margin:8px 0 0;padding-top:8px;border-top:1px solid #1A2A55}
html[data-theme=light] .pmeter{background:#F3F6FD;border-color:#CFD9F0}
html[data-theme=light] .pmeter-t,html[data-theme=light] .pmeter-sl{color:#0F1E45}
html[data-theme=light] .pmeter-bar i{background:#D5DEF2}
html[data-theme=light] .pmeter-d,html[data-theme=light] .pmeter-tip,html[data-theme=light] .pmeter-care{color:#1F2F57}
html[data-theme=light] .pmeter-h{color:#4A5B85}
html[data-theme=light] .pmeter-sn{color:#33436B}
html[data-theme=light] .pmeter-s{border-top-color:#D5DEF2}
html[data-theme=light] .pmeter-care{border-top-color:#D5DEF2}

/* ===== PROOFCHECK (part 5) ===== */
.pf-r{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;line-height:1.45;font-size:15px}
.pf-r>div{flex:1;min-width:0;overflow-wrap:anywhere}
.pf-t{flex:none;width:104px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:8px;padding:3px 4px;margin-top:2px}
.pf-FACT{background:#102A5C;color:#9DBBFF}
.pf-AI{background:#0B3A36;color:#3DF0D0}
.pf-MATCH{background:#3A2E12;color:#F5C56B}
.pf-UNK{background:#2A2F45;color:#B4C3E8}
.pf-leg{margin:0 0 6px;font-size:14px;color:#8FA0C8}
.pf-leg summary{cursor:pointer;padding:4px 0}
.pf-lg{padding-top:6px}
html[data-theme=light] .pf-FACT{background:#DCE8FF;color:#1F4FBF}
html[data-theme=light] .pf-AI{background:#D3F5EE;color:#0B6E5E}
html[data-theme=light] .pf-MATCH{background:#FFF1CC;color:#8A6100}
html[data-theme=light] .pf-UNK{background:#E6EAF3;color:#3A4A70}
html[data-theme=light] .pf-leg{color:#5B6B8F}
/* ===== STARTUP SCREEN (shows briefly, then removes itself) ===== */
#ss-splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 38%,#0B1A44 0%,#050B1F 60%,#03060F 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:ssOut .4s ease 1.5s forwards}
#ss-splash img{display:block;width:clamp(140px,34vh,200px);height:auto;animation:ssIn .6s ease both,ssPulse 2s ease-in-out .6s infinite}
#ss-splash .n{font-size:clamp(24px,6.4vw,30px);font-weight:600;color:#EAF0FF;margin:18px 0 0;letter-spacing:.01em;animation:ssIn .6s ease .15s both}
#ss-splash .t{font-size:clamp(15px,4.2vw,17px);color:#8FA0FF;margin:6px 0 0;animation:ssIn .6s ease .3s both}
#ss-splash .bar{width:120px;height:3px;border-radius:3px;background:#12214D;margin:26px 0 0;overflow:hidden;animation:ssIn .6s ease .4s both}
#ss-splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#3DF0D0,#2E7BFF);animation:ssBar 1.1s ease-in-out infinite}
@keyframes ssIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ssPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes ssBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes ssOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#ss-splash img,#ss-splash .bar i{animation:none}#ss-splash .n,#ss-splash .t,#ss-splash .bar{animation:none}}
/* ===== WELCOME SCREEN (shown after the startup screen; account buttons are placeholders) ===== */
#ss-welcome{position:fixed;inset:0;z-index:99998;background:radial-gradient(circle at 50% 30%,#0B1A44 0%,#050B1F 60%,#03060F 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 22px;overflow-y:auto;color:#EAF0FF;transition:opacity .3s ease}
#ss-welcome.out{opacity:0;pointer-events:none}
#ss-welcome .w{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;margin:auto 0}
#ss-welcome img{display:block;width:clamp(96px,20vh,140px);height:auto;margin:0 0 16px}
#ss-welcome h1{font-size:clamp(26px,7vw,32px);line-height:1.2;font-weight:700;margin:0 0 10px;color:#EAF0FF}
#ss-welcome p.s{font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:#B8C4E6;margin:0 0 24px}
#ss-welcome button{width:100%;min-height:58px;border-radius:30px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;margin:0 0 12px;padding:12px 20px;color:#EAF0FF;background:#0E1A3C;border:1px solid #2A3C75}
#ss-welcome button:active{filter:brightness(1.15)}
#ss-welcome button.go{background:linear-gradient(135deg,#2563EB,#1D4ED8);border-color:#2563EB;color:#fff;margin-bottom:0}
#ss-welcome button:focus-visible{outline:3px solid #9DBBFF;outline-offset:2px}
#ss-welcome .note{min-height:44px;font-size:16px;line-height:1.4;color:#F5C56B;margin:0 0 12px;padding:0 4px}
#ss-welcome input{width:100%;min-height:54px;border-radius:16px;font:inherit;font-size:18px;color:#EAF0FF;background:#0A1430;border:1px solid #2A3C75;padding:10px 16px;margin:0 0 10px;box-sizing:border-box}
#ss-welcome input::placeholder{color:#7C8BB8}
#ss-welcome input:focus-visible{outline:3px solid #9DBBFF;outline-offset:2px}
#ss-welcome [hidden]{display:none!important}
</style>
</head>

var SYSTEM=`You are ScamSense, a calm, friendly, smart AI assistant inside a scam-safety app. You are a helpful assistant first and a scam-analysis specialist second. People talk to you like a trusted friend who happens to be great at spotting scams.

THE MOST IMPORTANT RULE: tell the difference between someone talking TO you and someone asking you to CHECK something. Never assume a message is suspicious content. "Hello", "how are you", "I'm looking for a job", "thanks", questions about you or the app, and normal chat are just conversation. Answer them naturally and briefly. Do not analyze them, do not say "this doesn't look like a scam", and do not keep offering to scan things. Words like money, urgent, bank, love, job, investment, or password can be totally normal. Judge the whole situation, not keywords.

Each user turn may end with a bracketed ROUTING NOTE written by the app. It tells you the detected intent and may include an ON-DEVICE CHECK (a basic pattern check that ran on the phone). Follow the note, use the check as evidence, say it is basic, and never mention the note or the app's internals.

CONTEXT: Use the whole conversation. If someone says "I met a guy on Facebook", then "he works overseas", then "now he wants money", treat the money request as part of that story, not as an isolated sentence. If they later ask "is this a scam?" without pasting anything, analyze the situation they already described.

ONE ASSISTANT: You and the app's tools (Check Payment, Trace Picture, Check Authenticity, Verify Person, Check Message, Check Link, Check Profile, Get Help Now) are one experience. Say things like “I can help you look at the payment request”, not descriptions of separate features. The routing note may include KNOWN SO FAR: facts the app collected from this whole conversation, plus tools already used with short results. Treat everything the person says as the same situation. A money request after “I met someone on Facebook” is about that same person. Do not ask for what is already known. Do not suggest a tool already used unless there is a new reason. When a tool result appears in the conversation, build on it in plain words without repeating it. Suggest a tool only when it truly fits what was just said. For ordinary chat, suggest nothing.

WHEN THEY WANT HELP WITH A POSSIBLE SCAM:
- If you don't have enough to be useful, ask ONE simple question, the most useful one first. Never a list of questions. Plain words: "What did they say the money was for?" "Where did you get this picture?" "How do you know this person?" "Has he asked you for money before?"
- Once you have enough, stop asking and give the analysis.
- Never jump to a verdict. Use careful language: "This has some warning signs." "This could be a scam." "I'd be careful here." "I don't have enough information to say yet." Use plain levels: low concern, some warning signs, high concern, not enough information yet. Never give percentages. Never call a person a scammer or a criminal.
- Analysis format (adapt as needed, keep it short): **What I found** (one or two sentences), **Why** (short bullets naming the specific evidence from what they showed you), **What I'd do** (one to three clear steps). Add **What I'm not sure about** when it matters.
- Payments: figure out whether they are just talking about money, asking about a real transaction, or describing a suspicious request. If suspicious, say "I'd pause before paying" and list the specific warning signs (pressure, paying first, unusual payment method, secrecy, a story that keeps changing).
- Messages: look for pressure, urgency, threats, unusual payment requests, requests for passwords or codes, impersonation, fake jobs, fake prizes, fake investments, romance manipulation, fake support, delivery or customs fees, moving the chat elsewhere, secrecy, and suspicious links. Explain the actual evidence in their text.
- Links: you cannot open pages. The app only checks the text of the address. Say what was checked and what was not (where it leads, how old the site is). Never claim a page is safe or dangerous for sure.
- Pictures: describe only what you can really see. You cannot run a reverse image search or a real AI-image detector. ScamSense Image Trace and Image Authenticity are not connected yet in this prototype, so never invent matches, sources, or detector results. For AI or edited pictures use: strong signs of AI generation, possible AI editing, signs of ordinary editing, no strong synthetic signals seen, or not enough information. Never say "definitely real" or "definitely fake". A picture matching someone does not mean that person controls the account. You can suggest the user try a public reverse image search such as Google Lens or TinEye themselves.
- Verifying a person: ScamSense Verify lets a person voluntarily complete a live check, so the user can see whether a real person took part. It is a demo in this prototype. Keep four things separate: live presence, face similarity, identity, and account ownership. A pass does not prove legal identity or account ownership.
- Checking a person: ask what they want to check (verify them, their picture, their profile, or what they said) or let them tell you what happened.

IF THEY MAY ALREADY BE SCAMMED (sent money, gave a password, code, card or bank details, sent documents): stay calm and kind, never blame. Start with something like "Okay. Don't panic. Let's work through this step by step." Then either ask the single most important question or give the single most urgent safe step. Typical steps: contact the bank or service right now using official contact details they find themselves, change passwords, turn on two-step login, stop replying to the other person, keep screenshots, report it. Keep it short and practical.

STYLE: calm, patient, respectful, never make anyone feel stupid, never sound like a police officer or a security manual. Understand slang, typos, and short messages ("this guy asking me money", "can u check this"). Keep replies short by default: usually one to four sentences for chat. Say "Yes, I can help with that." rather than long politeness. Emojis sparingly. Some light humor in normal chat is welcome. Bold and short bullets only. No markdown headers, no tables.

HONESTY: never invent websites, sources, search results, image matches, verification results, or identity information. If a tool is not connected, say so plainly.

TRUSTCHECK ("Before You Trust It"): when the app note says TRUSTCHECK ACTIVE, the person is describing a whole SITUATION to look into: a person, a conversation, a photo, a website or link, a money request, or something else. Investigate the situation, not just one message. Use the format below instead of the older analysis format.

INVESTIGATION: treat everything the person has told you in this conversation (and any picture they attached) as ONE investigation, not separate questions. A claim, a money request, a website, a profile picture and a story are parts of the same situation, so connect them: say how one piece relates to another (for example, someone says they are a doctor, then asks for money, then gives a website, then sends a profile picture: describe these together as one situation). Quietly work out: the situation as a whole; the claims being made (by the other side, not only the user); the evidence the person actually shared; which warning signs are supported by what was said; what is unknown; the single missing fact that would help most; and the most practical next step. Never add details, evidence, or verification the person did not give you.

If you have enough for a careful first read, answer in this shape. Plain words, no jargon, short (usually under 230 words in total):
Line 1, alone and in bold, exactly one of: **HIGH CONCERN**, **SOME WARNING SIGNS**, **LOW CONCERN**, **NOT ENOUGH INFORMATION YET**.
**The situation** : one or two sentences describing the whole situation as ONE thing, as the person described it.
**Claims made** : 1 to 4 short bullets of what was SAID or CLAIMED (\"She says she is a doctor.\" \"He wants you to send money.\"). These are statements, not confirmed facts. Leave out the section if nobody claimed anything.
**Evidence you gave me** : 1 to 4 short bullets listing the things the person actually shared (messages, a link, a picture, a profile, payment details), each marked as shared and not checked (\"A website link was shared. I have not opened it.\"). Never list evidence that was not shared. Leave out the section if nothing was shared.
**Warning signs** : 2 to 4 bullets. Each must be supported by something the person told you, and where possible say how it connects to another part of the situation (\"Asked for money soon after saying he is a doctor.\"). Do not list generic scam signs that do not apply. If there is little to worry about, say so honestly here.
**What we don't know** : 1 to 3 bullets on what cannot be confirmed, for example who the person really is. Not knowing something is not proof that it is fake.
**How it fits together** : 1 to 3 bullets of your own analysis: how the claims, evidence and warning signs relate to each other. Say clearly this is analysis, not proof.
**What to do now** : one to three clear, practical steps in plain words. If money is involved, say to hold off sending anything until the situation has been verified.
If, and only if, one important fact is missing, finish with **One thing that would help** and ONE simple question. Never more than one question in a reply. If the app note says this is the third TrustCheck turn or later, do not ask again; give your best careful read.
Include a **Possible matches** section ONLY when the app note reports a real result from a real tool. Demo or placeholder results are never matches. Normally leave this section out completely.
If there is truly too little to say anything useful yet (for example only "I met someone online"), skip the format, ask ONE simple question, and add no tags.
On later turns, ADD the new information to the same investigation (new claims, new evidence, new warning signs, answered unknowns) and keep the same shape. You may be briefer. If the new answer changes the level, show it in line 1.
After a full TrustCheck result, put [[trustcheck]] on the tag line together with the [[concern:...]] tag (high, some, low, or unknown to match line 1). Do not add [[trustcheck]] to a plain follow-up question.

MONEY REQUEST FIREWALL (part of TrustCheck and Check Payment): whenever someone is being asked to send money, the safety message is: "Do not send money until we have checked the situation." Put it in **What to do now** in those words. The six things that matter are: who is asking, what the payment is for, how much, how the person knows them, why they say it is needed, and whether they are pushing to act quickly. First use everything already said in the conversation. Never ask something the person already told you. Ask only about what is missing, and only ONE question per reply, the most useful one first. Then explain in plain words what concerns the information supports, what is still unknown, and what to do before paying (for example contact them using details the person already trusts, ask the bank, talk to someone trusted). Do not call a payment request a scam on its own. Do not invent evidence. Not knowing something is not proof of wrongdoing. Keep it short, warm and simple.

PATTERN MAP (part of TrustCheck): after a full TrustCheck result whose first line is HIGH CONCERN or SOME WARNING SIGNS, you may also add ONE hidden pattern tag so the app can draw a small "how this may be developing" map. Build it ONLY from what the person actually told you. Never invent a step. Use 3 to 7 steps in the order they usually unfold in this kind of situation, for example: Someone contacts you, Trust is built, Chat moves somewhere private, A close or emotional bond forms, Money or an investment comes up, Pressure to hurry, A payment is requested. Pick only the steps that fit this situation, in plain words an older adult understands. Give each step a state: said (the person told you this happened) or notyet (the person did not say this happened; it is unknown, not proof that it did not happen). For each said step add a short note of 12 words or fewer, written as what was SAID or DONE (\"He asked you to move to WhatsApp.\"), and only if it is really unusual in this situation; otherwise leave the note empty. Mark at least two steps as said, or leave the tag out. Never mark a step as said because it is typical; if unsure, use notyet. Never call the other person a scammer or say the pattern proves anything. Tag format, on the tag line with the others, exactly: [[pattern: Step label|said|note ;; Step label|notyet| ;; Step label|said|note]]  (steps separated by ;; and fields by |, no brackets inside). If there is no useful pattern, add no pattern tag.

PRESSURE METER (part of TrustCheck): after a full TrustCheck result you may add ONE hidden pressure tag so the app can show a simple Pressure Meter. Pressure means urgency, secrecy, fear, threats, guilt, being told not to check, or other manipulation. List ONLY pressure signs that the person actually told you about or quoted. Never invent one, and never add one just because it is typical. Pressure can appear in scams, but pressure alone does not prove anyone is a scammer, so never say it does. Never give percentages or scores. Tag format, on the tag line with the others, exactly: [[pressure: level ;; Label|what was said or done ;; Label|what was said or done]]  where level is low, moderate, or high; labels are plain words such as Urgency, Secrecy, Threat, Only chance, Guilt, Discouraged from checking; each note is 14 words or fewer and written as what was SAID or DONE, no brackets or pipes inside. Use low when there is only mild urgency, moderate for clear urgency or emotional pressure, high for strong urgency together with secrecy, threats, or manipulation. If you see no pressure signs, leave the tag out.\n\nEVIDENCE CHAIN (part of TrustCheck): after a full TrustCheck result you may add ONE hidden chain tag so the app can show, for the most important claims, what supports each one. Use 1 to 4 claims, only claims that were actually made in the conversation. For each: the claim (as said); the evidence the person actually shared for it (a profile, a message, a link, a picture, a document; if nothing was shared, write: Nothing shared yet); what that evidence shows (usually only that the claim was made, or that something exists); what it does NOT prove (for example, it does not independently prove identity, profession, ownership, or that a website is real); and a status. Status is exactly one of: VERIFIED, PARTIALLY SUPPORTED, UNVERIFIED, CONFLICTING, UNKNOWN. You cannot verify anything yourself, so use VERIFIED only if the person told you they independently confirmed it through a trusted channel (for example, they phoned the official number). A claim that is only repeated by the same person or profile is UNVERIFIED. Use CONFLICTING only when two things the person told you contradict each other. Use UNKNOWN when you cannot tell. Never invent searches, sources, matches, identities or results. Tag format, on the tag line with the others, exactly: [[chain: Claim|Evidence|What it shows|What it does not prove|STATUS ;; Claim|Evidence|What it shows|What it does not prove|STATUS]]  (claims separated by ;; and fields by |, no brackets inside, each field 20 words or fewer). If there is no useful chain, add no chain tag.\n\nCHALLENGE THE STORY (part of TrustCheck): instead of only asking whether something is a scam, examine the important claims in the story. After a full TrustCheck result you may add ONE hidden challenge tag so the app can show a short \"Challenge the story\" card. Use 1 to 4 claims that were actually made (by the other side, or by a source the person mentioned). For each claim give: what they claim (as said); what would need to be true for the story to hold (plain words, for example: their identity and profession would need independent evidence); what the PERSON could check themselves (practical steps such as asking for a video call, contacting the organisation through its official published number, or asking the bank; never something you did); what is currently known (usually only what the person told you; say so); and what is still unknown. Never accuse anyone of lying, never call the claim false, and never say or imply that you searched, checked, opened, matched or verified anything. Unknown is not proof that a claim is false; say \"not independently verified\" rather than \"false\". Tag format, on the tag line with the others, exactly: [[challenge: Claim|What would need to be true|What you could check|Currently known|Still unknown ;; Claim|...]]  (claims separated by ;; and fields by |, no brackets inside, each field 22 words or fewer). If there is no useful challenge, add no challenge tag.\n\nIDENTITY CONFLICT FINDER (part of TrustCheck): compare the identity claims the person has told you about across the WHOLE conversation (where someone says they live or are, their job, their name, their age, their history, family, or any two parts of the story that cannot both be true) and look for contradictions. Only compare things the person actually told you or quoted. A change in wording is not a conflict; add a conflict only when two statements really are hard to reconcile. After a full TrustCheck result, if you find one or more, add ONE hidden conflict tag so the app can show an \"Identity conflict\" card. Use 1 to 3 conflicts. For each give: claim 1 (as said, with where or when it came up if the person told you); claim 2 (as said); and a one-sentence plain explanation of why the two cannot easily both be true. Never decide which claim is right, never say anyone is lying or a scammer, and never say a conflict proves anything: there may be an innocent explanation. Never identify anyone from a photo, never say two people or profiles are the same person, never invent identity details, and never say you searched or verified anything. Tag format, on the tag line with the others, exactly: [[conflict: Claim 1|Claim 2|Why it conflicts ;; Claim 1|Claim 2|Why it conflicts]]  (conflicts separated by ;; and fields by |, no brackets inside, each field 25 words or fewer). If you see no real conflict, add no conflict tag.\n\nTRUSTCHECK RULES: Keep four things apart at all times: facts the person told you; your own analysis; a possible match (only from a real tool result); and what is unknown. Never call a person a scammer, a criminal, or a liar. Describe behavior instead ("asking for money before you have met"). Never invent evidence, sources, searches, image matches, identity details, or verification results. You did not search the web. You cannot run a reverse image search, open websites, detect deepfakes, or verify anyone's identity, and you must never suggest that you did. Say plainly when you cannot verify something. Never give percentages or scores. It is fine to suggest talking to a trusted family member or friend, or contacting the platform or company through its official support.

PROOFCHECK ("Is This Proof Really Proof?"): when the app note says PROOFCHECK ACTIVE, the person wants to know whether something someone is using as proof (a screenshot, payment receipt, invoice, certificate, message, profile, profit screenshot) really is proof. Never declare an image, receipt, screenshot or document fake or forged unless there is reliable evidence. You cannot run forensic tools, a reverse image search, or ask a bank or issuer, so say so plainly. Never invent verification results, sources or matches. Say what you can see only if a picture is attached.
Answer short, in plain words, in this shape:
**What it shows** : 1 to 3 bullets, starting each with FACT: (seen directly in the picture or text) or AI ANALYSIS: (your own reading, which can be wrong).
**What it does not prove** : 2 to 3 bullets. Always include: This does not prove that the person is telling the truth.
**Warning signs** : only ones really supported by what is visible or said. If none, say so and add that this does not mean it is genuine.
**Possible match** : include ONLY if the app note reports a real match from inside the app. Label it POSSIBLE MATCH: and say similar is not identical. Otherwise leave this section out.
**Still unknown** : 2 to 3 bullets starting with UNKNOWN: on what must be checked independently (the issuer, the bank, the platform, the person) using details the person finds themselves.
**What to do now** : one to three steps. If money is involved: Do not send money until we have checked the situation.
Use careful wording such as: This may be evidence, but it should be independently verified. We cannot verify this from the information available. Never ask more than one question.

SUGGESTION TAGS: at the very end of a reply you may add tags on their own line. They are read by the app and hidden from the user, so never mention them.
[[concern:low]] or [[concern:some]] or [[concern:high]] or [[concern:unknown]]: only when you actually analyzed something.
[[actions:check_message,check_picture]]: at most three buttons, only when they truly fit the situation. Allowed keys: check_message, check_picture, check_proof, check_link, check_person, check_payment, check_profile, verify_person, trace_pic, auth_pic, emergency, tell_more, what_do. Use emergency only if they say they already lost money or gave away details. Use check_payment when someone is asked for money, trace_pic or auth_pic when they doubt a person's picture, and verify_person when they want to know if a person is real. Never add tags to casual conversation, greetings, or simple answers. Do not show every option every time.

EXAMPLES OF THE FEEL:
User: "What can you do?" You: "I can help you check suspicious messages, pictures, links, and people. You can also just tell me what happened and I'll help you figure out what to do."
User: "Someone sent me a message." You: "Sure. Send me the message and I'll take a look."
User: "This guy wants me to send him money." You: "Okay. What did he say the money was for?"
User: "Someone said I won a prize and I need to pay ₦20,000 first." You: "That has some warning signs. They're asking you to pay before you get the prize. Want me to break the message down and show you exactly what looks off?" [[concern:some]] [[actions:check_message]]`;

link:function(raw){
var s=raw.trim(),u;
try{u=new URL(/^https?:\/\//i.test(s)?s:'http://'+s)}catch(x){return null}
var host=u.hostname.toLowerCase(),ev=[];
if(/^http:\/\//i.test(s))ev.push('not a secure connection (http)');
if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host))ev.push('uses numbers instead of a name');
if(host.indexOf('xn--')>-1)ev.push('uses look-alike letters');
if(s.indexOf('@')>-1)ev.push('contains an @ sign');
if(host.split('.').length>=5)ev.push('very long address');
if((host.match(/-/g)||[]).length>=3)ev.push('many dashes in the name');
if(/\.(zip|top|xyz|click|icu|buzz|work|support|rest|gq|tk|ml|cf|ga)$/.test(host))ev.push('ending often seen in scams (.'+host.split('.').pop()+')');
if(/^(bit\.ly|tinyurl\.com|t\.co|cutt\.ly|is\.gd|rb\.gy|shorturl\.at|ow\.ly)$/.test(host))ev.push('shortened link');
Object.keys(Brands).forEach(function(b){var o=Brands[b];if(host.indexOf(b)>-1&&!(host===o||host.slice(-o.length-1)==='.'+o))ev.push('uses the name “'+b+'” but the real site is '+o)});
var kw=(u.pathname+u.search).match(/(login|verify|secure|update|wallet|claim|password|signin)/i);
if(kw)ev.push('link contains “'+kw[0]+'”');
var n=ev.length;
return{tone:n===0?'calm':(n>2?'high':'care'),notes:['address is '+host].concat(ev)};
}
};
function isLinkOnly(t){return /^\s*((https?:\/\/|www\.)\S+|[\w-]+(\.[\w-]+)+\/?\S*)\s*$/i.test(t)&&t.indexOf(' ')<0}
function localCheck(t){
if(!t||t.length<8)return null;
if(isLinkOnly(t))return Local.link(t);
var r=Local.message(t);
var urls=t.match(/(https?:\/\/|www\.)\S+/gi)||[];
urls.forEach(function(u){var l=Local.link(u);if(l&&l.tone!=='calm')r.notes.push('link '+u+' has warning signs: '+l.notes.slice(1).join(', '))});
if(urls.length&&r.tone==='calm'&&urls.some(function(u){var l=Local.link(u);return l&&l.tone!=='calm'}))r.tone='care';
return r;
}

}

function bubble(m,i){
if(m.role==='user')return '<div style="display:flex;justify-content:flex-end;margin:0 0 16px"><div style="max-width:84%;background:#1F63FF;border-radius:18px 18px 4px 18px;padding:10px 14px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere">'+m.html+'</div></div>';
var body=m.loading?'<span class="dots"><i></i><i></i><i></i></span><span class="sr-only" style="position:absolute;left:-9999px">ScamSense is typing</span>':m.html;
if(m.tc&&!m.loading&&!m.streaming)body=TrustCheck.head(m.level)+(m.fw?MoneyFirewall.banner():'')+body+(m.chain?EvidenceChain.html(m.chain):'')+(m.challenge?StoryChallenge.html(m.challenge):'')+(m.conflict?IdentityConflict.html(m.conflict):'')+(m.plan?ActionPlan.html(m.plan):'')+(m.pressure?PressureMeter.html(m.pressure):'')+(m.pmap?PatternMap.html(m.pmap):'')+TrustCheck.foot();

if(m.raw&&!m.loading&&!m.streaming)body+='<div style="margin-top:8px"><button class="chip" data-act="listen" data-arg="'+i+'" style="height:38px;font-size:13px">'+I('volume','aria-hidden="true"')+'Listen</button></div>';
if(m.demo&&!m.loading&&!m.streaming)body+='<div style="border:1px dashed #6B5A22;background:#1C1808;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:13px;color:#F5C56B">'+I('flask','aria-hidden="true"')+' '+DEMO_NOTES[m.demo]+'</div>';
if(m.actions&&m.actions.length&&!m.streaming&&!S.busy&&i===S.cur.msgs.length-1)body+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+m.actions.map(function(k){return '<button class="chip" data-act="do" data-arg="'+k+'">'+ACTIONS[k].label+'</button>'}).join('')+'</div>';
if(m.retry)body+='<div style="margin-top:10px"><button class="btn" data-act="retry" style="background:#1F63FF;color:#fff">Try again</button></div>';
var bg=m.warn?'linear-gradient(135deg,#3A1226,#1E1440)':'#0F1B3F',bd=m.warn?'#6B2440':'#1B2B55';
return '<div style="display:flex;gap:10px;margin:0 0 20px">'+bot(34)+'<div class="ai" style="background:'+bg+';border:1px solid '+bd+'">'+body+'</div></div>';
}

function toJpeg(file){

var url=URL.createObjectURL(file),im=new Image();
im.onload=function(){

var c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
res(c.toDataURL('image/jpeg',0.85).split(',')[1]);
};
im.onerror=function(){rej(new Error('image'))};
im.src=url;
});
}

var msg=txt;try{var j=JSON.parse(txt);if(j&&j.error&&j.error.message)msg=(j.error.type?j.error.type+': ':'')+j.error.message}catch(e){}
throw Provider.err('http_'+res.status,'HTTP '+res.status+(msg?' - '+String(msg).slice(0,300):' '+res.statusText));

stream:async function(st,onDelta,messages){
Provider.lastError=null;
var res;
try{
res=await Provider.request(messages,true);

}catch(e){

st.text=t;onDelta(t);return t;
}
var reader=res.body.getReader(),dec=new TextDecoder(),buf='';

var r=await reader.read();

buf+=dec.decode(r.value,{stream:true});
var lines=buf.split('\n');buf=lines.pop();
for(var i=0;i<lines.length;i++){
var l=lines[i].trim();
if(l.indexOf('data:')!==0)continue;
var j=l.slice(5).trim();

var ev;try{ev=JSON.parse(j)}catch(x){continue}

var box=r?card('<div class="rs">One-time verification request<span class="tag">DEMO</span></div><div style="font-size:16px;font-weight:500;word-break:break-all;margin:4px 0 6px">'+esc(r.link)+'</div><div class="rs" style="margin:0 0 10px">ID '+esc(r.id)+'. Single use. Valid for '+esc(r.expires)+'. This link doesn’t work. It only shows the idea.</div><button class="chip" data-act="copyreq">'+I('copy','aria-hidden="true"')+'Copy link</button><span id="cp" style="font-size:14px;color:#8FA0C8;margin-left:8px"></span>'):prim('Generate verification request','mkreq');
var rows=r?row('camera','#2563EB','See what they would see','Preview the other person’s screens (demo).','vr_start')+(res?row('shield-check','#10A37F','View the result','From the last demo check.','vr_view'):''):'';
return title('ScamSense Verify','Live Identity Verification')
+'<div style="margin:0 0 14px">Ask someone to show they’re really there, right now. It’s their choice, and they’ll be told why.</div>'
+box+rows
+sect('How it works')+'<ol class="ul"><li>You generate a one-time request.</li><li>You send the link to the person.</li><li>They read what’s asked and choose whether to agree.</li><li>If they agree, they complete a short live check.</li><li>You see a result that says what it does and doesn’t show.</li></ol>'
+sect('What a real check could show')+bullets(['Live check passed or not.','Time of the check.','Country only, if they allow it.','A one-time ID.','Optional: face similarity with a picture you supply.'])
+sect('Live person detected is not identity confirmed')+'<div style="color:#B4C3E8;margin:0 0 8px">A pass doesn’t prove legal identity. Face similarity doesn’t prove someone owns an account. This prototype runs no real verification.</div>';
};
Views.vr_intro=function(){
return demoStrip()+title('Someone asked you to complete a quick live check','Requested through ScamSense Verify')
+card('<div style="margin:0 0 8px">A person you’re in contact with wants to see that a real person is on the other end, right now.</div>'+bullets(['It takes about a minute.','It’s your choice. You can say no.','Your camera is only used if you agree on the next screen.']))
+sect('What you’ll be asked to do')+bullets(['Look at the camera.','Follow a few simple prompts, like turning your head.'])
+sect('What it does not do')+'<div style="color:#B4C3E8;margin:0 0 16px">It doesn’t read your ID or prove who you legally are. It only helps the other person see that a live person took part.</div>'
+prim('Continue','vr_continue')+sec('No thanks','vr_decline');
};
Views.vr_consent=function(){
var v=S.vf;
return demoStrip()+title('Before you start','Your camera is only used if you agree.')
+chk('cam',v.consentCam,'Use my camera for a short live check','Used only during this check.',true)
+chk('loc',v.consentLoc,'Share my country','Country only. No exact location.',false)
+chk('sim',v.consentSim,'Compare my face with a picture','Only if the requester supplied one. Optional.',false)
+'<div class="rs" style="margin:2px 2px 14px">In this demo, no camera turns on and no browser permission is requested. Real consent and camera access would be handled here.</div>'
+prim('Allow camera and start','vr_allow',undefined,!v.consentCam)+sec('Go back','vr_start');
};
Views.vr_live=function(){
var i=Math.min(S.stepIdx||0,VR_PROMPTS.length-1);
return demoStrip()+title('Live check','Prompt '+(i+1)+' of '+VR_PROMPTS.length)
+'<div style="display:flex;flex-direction:column;align-items:center;margin:6px 0 16px"><div class="vf">'+I('user','aria-hidden="true" style="font-size:84px;color:#3A4B7E"')+'</div><div class="rs" style="margin-top:8px">Simulated. No camera is on.</div></div>'
+card('<div style="font-size:20px;font-weight:600;text-align:center">'+VR_PROMPTS[i]+'</div>')
+stepsView(VR_PROMPTS,i);
};
var VR_PROMPTS=['Look straight at the camera','Slowly turn your head to the left','Now slowly to the right','Blink once'];
function vrProgSteps(){var s=['Checking for a live person (simulated)'];if(S.vf.consentSim)s.push('Comparing with the supplied picture (simulated)');s.push('Saving the result');return s}
Views.vr_prog=function(){return demoStrip()+title('Checking','This takes a moment.')+stepsView(vrProgSteps(),S.stepIdx||0)};
Views.vr_result=function(){
var r=S.vf.res;
if(!r)return Views.verify();
if(r.declined)return title('No check completed','The other person chose not to take part.')
+card('<div style="margin:0 0 8px">That’s their right, and on its own it doesn’t prove anything. People decline for many reasons.</div><div>If money or personal details are involved, it’s fine to wait until you’re comfortable.</div>')
+kv('Verification ID',esc(r.id))+kv('Date and time',esc(fmt(r.at)))
+'<div style="height:12px"></div>'+sec('Back to chat','chat')+sec('Make a new request','mkreq');
var sim=r.similarity?'Demo value shown here. Compares two images only.':'Not requested';
return title('ScamSense Verify','Result')
+demoBox('Demo result. No real liveness or face check was run.')
+'<div style="background:linear-gradient(135deg,#0B3A36,#0F2A66);border:1px solid #1F6B63;border-radius:16px;padding:16px;margin:0 0 14px;display:flex;gap:12px;align-items:center"><span class="circ" style="background:#10A37F">'+I('shield-check','aria-hidden="true"')+'</span><div><div style="font-size:20px;font-weight:600;line-height:1.25">Live person detected</div><div class="rs">Demo result</div></div></div>'
+card(kv('Liveness','Passed (demo)')+kv('Verification ID',esc(r.id))+kv('Date and time',esc(fmt(r.at)))+kv('Country',r.country?'Demo value. No real location was read.':'Not shared')+kv('Consent','Confirmed by the other person')+kv('Face similarity',sim))
+'<div style="background:#1C1808;border:1px solid #6B5A22;border-radius:16px;padding:14px;margin:0 0 14px"><div style="font-weight:600;color:#F5C56B">Identity confirmed: no</div><div style="color:#E8D9A8;font-size:15px">“Live person detected” and “Identity confirmed” are different things. This check does not confirm who they are.</div></div>'
+sect('What this shows')+bullets(['At the time of the check, something responded to the prompts, as a live person would.'])
+sect('What this does NOT show')+bullets(['Their legal identity.','That they own the account you’re talking to.','That their intentions are honest.','Face similarity, if used, only compares two images. It doesn’t prove ownership.'])
+'<div style="height:6px"></div>'+prim('Add to a case','add_ver')+sec('Back to chat','chat');
};

/* ----- Feature 2: Image Trace ----- */
Views.trace=function(){
var T=S.trace;
if(T.stage==='run')return title('Searching','Demo trace in progress')+demoBox('Demo. No image search is running. This only shows how results would look.')+'<div style="height:14px"></div>'+stepsView(TRACE_STEPS,S.stepIdx||0);
if(T.stage==='done'&&T.res)return traceResults();
var tiles=T.imgs.map(function(o,i){return '<div class="th"><img src="'+o.url+'" alt="Picture '+(i+1)+'"><button class="ib" data-act="tr-rm" data-arg="'+i+'" aria-label="Remove picture '+(i+1)+'">'+I('x','aria-hidden="true"')+'</button></div>'}).join('');
var add=T.imgs.length<3?'<button class="th add" data-act="tr-add" aria-label="Add a picture">'+I('upload','aria-hidden="true" style="font-size:24px"')+'<span>'+T.imgs.length+'/3</span></button>':'';
return vm()+title('Trace this picture','See if a picture appears publicly elsewhere.')
+'<div style="margin:0 0 12px">Add 1 to 3 pictures of the person. Clear, close-up pictures work best.</div>'
+'<div class="thr">'+tiles+add+'</div>'
+sect('Name or alias they use (optional)')+fld('tr.alias','For example, the name on their profile')
+'<div class="demo" style="margin:0 0 14px">'+I('flask','aria-hidden="true"')+' Image Trace isn’t connected to a search service yet. You’ll see demo results.</div>'
+prim('Start demo trace','tr-start',undefined,!T.imgs.length)
+'<div class="rs" style="text-align:center">Your pictures stay on this device in this prototype.</div>';
};
function traceResults(){
var T=S.trace,R=T.res;
var cards=R.matches.map(function(m,k){
return '<div class="card"><div style="display:flex;gap:12px;align-items:center;margin:0 0 10px"><div class="th" style="width:56px;height:56px;border-style:dashed;color:#6B7BAA;flex:none" aria-hidden="true">'+I('photo','style="font-size:24px"')+'</div><div style="min-width:0"><div class="rt">Possible match '+(k+1)+'<span class="tag">PLACEHOLDER</span></div><div class="rs">For your picture '+(m.img+1)+'</div></div></div>'
+kv('Source',esc(m.src))+kv('Source type',esc(m.type))+kv('Date',esc(m.date))+kv('Public profile or source',esc(m.profile))+kv('Visual similarity',esc(m.sim))
+'<div class="h" style="margin-top:10px">Why this would matter</div><div style="color:#C9D6F5;font-size:15px">'+esc(m.why)+'</div></div>';
}).join('');
var none=[];for(var i=0;i<R.count;i++){if(!R.matches.some(function(m){return m.img===i}))none.push(i+1)}
return title('Trace results','Demo results')
+demoBox('Demo results. No image search was run. Nothing below is a real match or a real source.')
+'<div style="height:12px"></div>'
+warnBox('Finding this picture somewhere else does not prove that the person in the suspicious account owns that other profile.','Important')
+(R.alias?card('<div class="rs">Name or alias you entered</div><div style="font-weight:600">'+esc(R.alias)+'</div><div class="rs">This is your input. ScamSense hasn’t checked it against anything.</div>'):'')
+sect('Image reuse is not identity')+'<div style="color:#B4C3E8;margin:0 0 10px">A picture can appear in many places for many reasons. Seeing it elsewhere is a clue to look into. It doesn’t tell you who is behind any account.</div>'
+sect('Possible image matches (placeholders)')+(cards||'<div class="rs">No sample matches.</div>')
+(none.length?'<div class="rs" style="margin:0 0 12px">No sample matches in this demo for picture'+(none.length>1?'s ':' ')+none.join(', ')+'.</div>':'')
+sect('What you can do now')+bullets(['Try a public reverse image search yourself, like Google Lens or TinEye, and compare what you find.','Ask the person a question only they could answer, or use ScamSense Verify.','Keep what you find in a case.'])
+'<div style="height:6px"></div>'+prim('Add to a case','add_trace')+sec('Check picture authenticity','pic-auth')+sec('Back to chat','chat')+sec('Start over','tr-reset');
}

/* ----- Feature 3: Image Authenticity ----- */
Views.auth=function(){
var A=S.auth;
if(A.stage==='run')return title('Analysing','Demo analysis in progress')+demoBox('Demo analysis. It reads this file’s built-in details on this device. No AI detector is connected.')+'<div style="height:14px"></div>'+stepsView(AUTH_STEPS,S.stepIdx||0);
if(A.stage==='done'&&A.res)return authResult();
var pick=A.img?'<div class="card" style="display:flex;gap:12px;align-items:center"><img src="'+A.img.url+'" alt="Picture to check" style="width:64px;height:64px;object-fit:cover;border-radius:12px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(A.img.file.name)+'</div><div class="rs">Image • '+(A.img.file.size/1048576).toFixed(1)+' MB</div></div><button class="ib" data-act="au-rm" aria-label="Remove picture" style="font-size:20px">'+I('x','aria-hidden="true"')+'</button></div>':'<button class="th add" data-act="au-add" style="width:100%;height:120px;margin:0 0 14px" aria-label="Choose a picture">'+I('upload','aria-hidden="true" style="font-size:28px"')+'<span>Choose a picture</span></button>';
return vm()+title('Check picture authenticity','Look for signs that a picture may be AI-generated or edited.')+pick
+'<div class="demo" style="margin:0 0 14px">'+I('flask','aria-hidden="true"')+' Demo analysis. It reads the file’s built-in details (metadata) on this device. A real AI-image detector isn’t connected.</div>'
+prim('Run demo analysis','au-start',undefined,!A.img)
+'<div class="rs" style="text-align:center">Your picture stays on this device in this prototype.</div>';
}
function authResult(){
var A=S.auth,R=A.res,key=A.preview||R.cat,C=AUTH_CATS[key],prev=!!A.preview;
var found=prev?C.sample:R.found;
var not=C.not.concat(COMMON_NOT);
var others=Object.keys(AUTH_CATS).filter(function(k){return k!==key}).map(function(k){return '<button class="chip" data-act="au-prev" data-arg="'+k+'" style="height:auto;min-height:40px;padding:6px 14px;text-align:left">'+AUTH_CATS[k].label+'</button>'}).join('');
return title('Authenticity result',prev?'Sample outcome':'Demo analysis')
+(prev?demoBox('Sample outcome. This shows how this result would look. It is not about your picture.'):demoBox('Demo analysis of file details only. No AI detector was run. Treat this as a clue, not an answer.'))
+'<div style="height:12px"></div>'
+'<div style="border:1px solid '+C.color+';background:#0E1A3C;border-radius:16px;padding:14px;margin:0 0 14px;display:flex;gap:12px;align-items:center"><span class="circ" style="background:'+C.color+'">'+I(C.icon,'aria-hidden="true"')+'</span><div><div style="font-size:18px;font-weight:600;line-height:1.3">'+C.label+'</div><div class="rs">'+C.summary+'</div></div></div>'
+sect('What we found')+bullets(found.map(function(x){return prev?esc(x):x}))
+sect('What this does NOT prove')+bullets(not)
+'<div class="rs" style="margin:6px 0 14px">We can’t be certain either way. A picture can be real and still carry odd marks, or be synthetic and carry none.</div>'
+(prev?sec('Back to my result','au-prev','')+'':'')
+sect('See how other results look')+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px">'+others+'</div>'
+(prev?'':prim('Add to a case','add_auth')+sec('Trace this picture','pic-trace'))+sec('Back to chat','chat')+sec('Check another picture','au-reset');
}

/* ----- Feature 4: Money Check ----- */
Views.money=function(){
var M=S.money;
if(M.res)return moneyResult();
return vm()+title('Money Check','Check a payment request before you send anything.')
+'<div style="margin:0 0 12px">Describe or paste what they asked for. Include the amount, what it’s for, and how they want to be paid.</div>'
+fld('money.text','Paste or describe the payment request',6)
+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px"><button class="chip" data-act="mo-ex">Try an example</button></div>'
+prim('Check this request','mo-run')
+'<div class="rs" style="text-align:center">Basic pattern check on this device. I don’t see the other person’s account or any bank records.</div>';
};
function moneyResult(){
var r=S.money.res,L=MONEY_LEVELS[r.level];
var found=[];
if(r.amount)found.push('Amount mentioned: <b style="font-weight:600">'+esc(r.amount)+'</b>.');
r.signals.forEach(function(s){found.push('<b style="font-weight:600">'+s.label+'</b>: '+s.find+' (“'+esc(s.quote)+'”)')});
if(!r.signals.length&&r.level!=='unknown')found.push('No common warning signs matched in the words you gave me.');
var why=r.signals.map(function(s){return s.why});
if(!why.length)why=r.level==='unknown'?['With more detail I can look for specific warning signs.']:['Scams don’t always use obvious wording. What matters most is who is asking and whether you’ve checked them yourself.'];
var next=[r.level==='low'?'Confirm who you’re paying before you send anything.':(r.level==='unknown'?'Tell me a bit more: who is asking, how much, and how they want to be paid.':'Pause. Don’t send anything yet.')];
r.signals.forEach(function(s){if(next.indexOf(s.next)<0)next.push(s.next)});
next.push('Contact the person or company using details you already trust, not ones from this message.');
next.push('Talk it over with someone you trust before paying.');
next=next.slice(0,6);
return title('Money Check','Result')
+demoBox('Basic pattern check on this device. No transaction, account, or bank was checked.')
+'<div style="height:12px"></div>'
+'<div style="border:1px solid '+L.color+';background:#0E1A3C;border-radius:16px;padding:14px;margin:0 0 14px"><div style="font-size:18px;font-weight:600;color:'+L.color+'">'+L.name+'</div><div style="margin-top:4px">'+L.text+'</div></div>'
+(r.level!=='unknown'?PressureMeter.html(PressureMeter.build('',r.text))+'<div style="height:14px"></div>':'')
+sect('What I found')+bullets(found)
+sect('Why it matters')+bullets(why)
+sect('What you should do next')+bullets(next)
+'<div class="rs" style="margin:6px 0 14px">I can’t tell you who is behind this request, and I’m not saying anyone is a scammer. I’m pointing out patterns worth checking.</div>'
+prim('Add to a case','add_money')+sec('Back to chat','chat')+sec('I already sent money','em','money')+sec('Check another request','mo-reset');
}

/* ----- Feature 5: Cases ----- */
Views.cases=function(){
if(!S.cases.length)return title('Cases','Keep evidence from different checks in one place.')+'<div style="text-align:center;padding:28px 12px;color:#8FA0C8"><div style="margin:0 auto 12px;width:56px;height:56px;border-radius:50%;background:#13224A;display:flex;align-items:center;justify-content:center;font-size:26px;color:#7F9BFF">'+I('folder','aria-hidden="true"')+'</div><div style="color:#EAF0FF;font-weight:600;margin-bottom:4px">No cases yet</div>Start one when something feels off. You can add messages, pictures, links, and check results.</div>'+prim('Start a case','cs-new');
return title('Cases','Keep evidence from different checks in one place.')+S.cases.map(function(c){return row('folder','#F59E0B','Case: '+esc(c.title),c.items.length+' item'+(c.items.length===1?'':'s')+' · '+esc(fmt(c.created)),'cs-open',c.id)}).join('')+'<div style="height:6px"></div>'+prim('Start a case','cs-new');
};
Views.case_new=function(){
var sug=['Person I met online','Payment request','Suspicious message','Picture that looks fake'];
return title('Start a case','Give it a name you’ll recognise.')
+(S.pendingItems?'<div class="rs" style="margin:-8px 0 12px">What you were adding will go into this case.</div>':'')
+fld('case.title','For example, Person I met online')
+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px">'+sug.map(function(s,i){return '<button class="chip" data-act="cs-sugg" data-arg="'+i+'">'+s+'</button>'}).join('')+'</div>'
+prim('Create case','cs-create');
};
Views.case_pick=function(){
return title('Add to which case?')+S.cases.map(function(c){return row('folder','#F59E0B','Case: '+esc(c.title),c.items.length+' items','cs-pick',c.id)}).join('')+row('plus','#3B4A78','Start a new case','','cs-pick','new');
};
function itemCard(x,i){
var t=ITEM_TYPES[x.type]||ITEM_TYPES.note;
var thumb=x.imgUrl?'<img src="'+x.imgUrl+'" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none">':'<span class="circ" style="background:#3B4A78;width:40px;height:40px;font-size:20px">'+I(t.icon,'aria-hidden="true"')+'</span>';
return '<div class="card" style="display:flex;gap:12px;align-items:flex-start;padding:12px">'+thumb+'<div style="flex:1;min-width:0"><div style="margin:0 0 4px">'+SRC_TAG[x.source]+'</div><div class="rt">#'+(i+1)+' '+esc(x.title)+'</div>'+(x.detail?'<div class="rs" style="white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">'+esc(x.detail)+'</div>':'')+'<div class="rs" style="font-size:12px">'+esc(fmt(x.ts))+'</div></div><button class="ib" data-act="cs-rm" data-arg="'+x.id+'" aria-label="Remove item" style="font-size:18px;width:36px;height:36px">'+I('trash','aria-hidden="true"')+'</button></div>';
}
function tcCaseBlock(c){
var x=c.items.filter(function(i){return i.tc}).slice(-1)[0];
if(!x)return '';
var t=x.tc,n=c.items.filter(function(i){return i.source==='user'}).length;
function chip(k,l){return '<span class="tcchip tc-'+k+'">'+l+'</span>'}
function sc(h,k,l,a,empty){return '<div class="h">'+h+chip(k,l)+'</div>'+(a&&a.length?bullets(a.map(esc)):'<div class="rs" style="margin:0 0 8px">'+empty+'</div>')}
return sect('Investigation')+'<div class="rs" style="margin:0 0 8px">One situation, kept in one place. Based only on what you shared. Nothing here has been verified.</div>'
+sc('Situation','fact','As you said',t.told,'No summary was listed.')
+sc('Claims','fact','Claimed',t.claims,'No claims were listed in this read.')
+'<div class="h">Evidence you provided'+chip('fact','You provided')+'</div>'+(t.evid&&t.evid.length?bullets(t.evid.map(esc)):'')+'<div class="rs" style="margin:0 0 8px">'+n+' item'+(n===1?'':'s')+' you shared, listed under “What you added”. Shared, not verified.</div>'
+(t.chain&&t.chain.length?'<div class="h">Evidence chain'+chip('ai','Analysis')+'</div>'+EvidenceChain.html(t.chain,true):'')
+(t.challenge&&t.challenge.length?'<div class="h">Challenge the story'+chip('ai','Analysis')+'</div>'+StoryChallenge.html(t.challenge,true):'')
+(t.conflict&&t.conflict.length?'<div class="h">Identity conflict'+chip('ai','Analysis')+'</div>'+IdentityConflict.html(t.conflict,true):'')
+sc('Warning signs','ai','Analysis',t.signs,'No warning signs were listed in this read.')
+sc('Unknowns','unk','Unknown',t.unk,'No unknowns were listed in this read. That does not mean everything is known.')
+'<div class="h">AI analysis'+chip('ai','Analysis')+'</div><div class="rs" style="margin:0 0 6px">'+esc(t.label)+'. An opinion from what you shared, not a verdict.</div>'+(t.analysis&&t.analysis.length?bullets(t.analysis.map(esc)):'')
+sc('Recommended next steps','ai','Analysis',t.next,'No next steps were listed in this read.');
}
Views.case=function(){
var c=curCase();
if(!c)return Views.cases();
var fl=S.flash?'<div style="font-size:14px;color:#7FE6CF;margin:0 0 10px">'+esc(S.flash)+'</div>':'';S.flash='';
var cnt=function(t){return c.items.filter(function(x){return x.type===t}).length};
var chips=['message','picture','link','profile','payment','note'].filter(function(t){return cnt(t)}).map(function(t){return '<span class="chip" style="height:32px;font-size:13px;cursor:default">'+cnt(t)+' '+ITEM_TYPES[t].label.toLowerCase()+(cnt(t)>1&&t!=='profile'?'s':'')+'</span>'}).join('');
var conn=caseConnections(c);
var connHtml=conn.length?conn.map(function(k){return '<div class="card" style="border-left:3px solid #3DF0D0"><div style="margin:0 0 4px">'+SRC_TAG.ai.replace('SCAMSENSE ANALYSIS','SCAMSENSE OBSERVATION')+'</div><div style="font-weight:500">'+esc(k.text)+'</div><div class="rs">'+esc(k.basis)+'</div></div>'}).join(''):'<div class="rs" style="margin:0 0 12px">Nothing connects yet. Add more items or run another check, and I’ll look for links between them.</div>';
var mine=c.items.map(function(x,i){return {x:x,i:i}}).filter(function(o){return o.x.source==='user'});
var ana=c.items.map(function(x,i){return {x:x,i:i}}).filter(function(o){return o.x.source!=='user'});
var add=['message','picture','link','profile','payment','note'].map(function(t){return '<button class="chip" data-act="cs-add" data-arg="'+t+'">'+I(ITEM_TYPES[t].icon,'aria-hidden="true"')+ITEM_TYPES[t].label+'</button>'}).join('');
return fl+title('Case: '+esc(c.title),'Started '+esc(fmt(c.created)))
+(chips?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px">'+chips+'</div>':'')

var MoneyFirewall={
SAFE:'Do not send money until we have checked the situation.',
QS:[
{k:'who',q:'Who is asking for the money?',ph:'A name, or “someone I met online”'},

{k:'amount',q:'How much are they asking for?',ph:'For example, $200'},

],
reset:function(){S.fw={pressure:''};['who','what','amount','know','why'].forEach(function(k){S.f['fw.'+k]=''})},

known:function(){
var f=Concierge.facts(),t=this.base(),k={},a=t.match(AMOUNT_RE),r=analyzeMoney(t);
if(f.amount||a)k.amount=f.amount||a[0].trim();
if(f.platform)k.know='You said you know them through '+f.platform+'.';
if(r.signals.some(function(s){return s.k==='urgency'||s.k==='pressure'}))k.pressure='The request sounds like it is pushing you to act fast.';

},

view:function(){
var self=this,kn=this.known(),h=title('Before you pay','Let’s slow down for a moment.')+'<div class="warnbox" style="margin:0 0 14px">'+I('shield-check','aria-hidden="true" style="font-size:20px"')+'<div style="font-weight:600">'+this.SAFE+'</div></div>';
var ks=Object.keys(kn);
if(ks.length)h+=sect('What I already know')+bullets(ks.map(function(x){return x==='amount'?'The amount mentioned: <b style="font-weight:600">'+esc(kn.amount)+'</b>.':esc(kn[x])}));
h+='<div style="margin:0 0 12px">Answer what you can. “I don’t know” is a fine answer.</div>';
this.QS.forEach(function(q){if(kn[q.k])return;h+='<div style="font-weight:600;margin:10px 0 6px">'+q.q+'</div>'+fld('fw.'+q.k,q.ph)});
if(!kn.pressure){var p=S.fw.pressure;h+='<div style="font-weight:600;margin:14px 0 6px">Are they pressuring you to act quickly?</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">'+[['yes','Yes'],['no','No'],['unsure','Not sure']].map(function(o){return '<button class="chip" data-act="fw-p" data-arg="'+o[0]+'"'+(p===o[0]?' style="background:#14D3B0;color:#04222A;border-color:#14D3B0"':'')+'>'+o[1]+'</button>'}).join('')+'</div>'}
return h+prim('Check before paying','fw-run')+'<div class="rs" style="text-align:center">Basic check on this device. I can’t see any account, bank record, or the other person.</div>';
},
result:function(){
var R=S.fw.res,L=MONEY_LEVELS[R.r.level],con=[],unk=[],next=[];
R.r.signals.forEach(function(s){con.push('<b style="font-weight:600">'+s.label+'</b>: '+s.find+' (“'+esc(s.quote)+'”)')});
if(R.pressure==='yes'&&!R.r.signals.some(function(s){return s.k==='urgency'||s.k==='pressure'}))con.push('<b style="font-weight:600">Pressure</b>: you said they are pushing you to act quickly.');
if(/online|never met|haven'?t met|stranger|facebook|instagram|whatsapp|telegram|tinder|dating|snapchat/i.test(R.a.know||''))con.push('<b style="font-weight:600">Not met in person</b>: you said you know them mainly through an online contact.');
if(!con.length)con.push('Nothing in what you shared stands out as a warning sign so far.');
this.QS.forEach(function(q){var v=(R.a[q.k]||'').trim();if(!v&&!R.kn[q.k])unk.push('You didn’t say: '+q.q.charAt(0).toLowerCase()+q.q.slice(1))});
if(!R.pressure&&!R.kn.pressure)unk.push('You didn’t say whether they are pressuring you to act quickly.');
unk.push('Whether the person or business is who they say they are. I can’t check that from here.');

next.push('Pause. '+this.SAFE);
next.push('Contact them using details you already trust, not ones from this request.');
next.push('Ask your bank, or someone you trust, before paying.');
R.r.signals.forEach(function(s){if(next.length<5&&next.indexOf(s.next)<0)next.push(s.next)});

+'<div class="warnbox" style="margin:0 0 14px">'+I('shield-check','aria-hidden="true" style="font-size:20px"')+'<div style="font-weight:600">'+this.SAFE+'</div></div>'

+sect('What is unknown')+bullets(unk)
+sect('Before you pay')+bullets(next)

+prim('Add to a case','add_money')+sec('Talk it through in chat','money_chat')+sec('Check a person','verify')+sec('I already sent money','em','money')+sec('Start over','fw-open');
}

/* Investigation Case: save the current TrustCheck situation as one case (reuses the Case engine) */
function tcSections(raw){
var out={told:[],claims:[],evid:[],signs:[],unk:[],analysis:[],next:[]},cur=null;
String(raw||'').split('\n').forEach(function(l){
var h=l.match(/^\s*\*\*([^*]+)\*\*\s*:?\s*$/);
if(h){var k=h[1].replace(/&#39;|[’‘]/g,"'").replace(/:$/,'').toLowerCase().trim();
cur=(k.indexOf('what you told me')===0||k.indexOf('the situation')===0)?'told':k.indexOf('claims made')===0?'claims':k.indexOf('evidence you gave')===0?'evid':(k.indexOf('why')===0||k.indexOf('warning signs')===0)?'signs':k.indexOf('how it fits')===0?'analysis':(k.indexOf("what we don't know")===0||k.indexOf("what i don't know")===0||k.indexOf('what we do not know')===0)?'unk':k.indexOf('what to do now')===0?'next':null;return}
var b=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
if(cur&&b){var t=b[1].replace(/\*\*|`/g,'').trim();if(t)out[cur].push(t)}else if(cur==='told'&&l.trim()&&!/^\s*\*\*/.test(l)){out.told.push(l.replace(/\*\*|`/g,'').trim())}
});
return out;
}

if(!m)return;
var items=[];
try{(S.cur.api||[]).forEach(function(x){
if(x.role!=='user')return;
var c=x.content;if(Array.isArray(c))c=c.filter(function(q){return q.type==='text'}).map(function(q){return q.text}).join(' ');
c=String(c||'').trim();
if(c)items.push(mkItem('note','user','What you told ScamSense',c.slice(0,600)))
})}catch(e){}

/* =====================================================================
   TRUSTCHECK ("Before You Trust It")
   Lets the chat investigate a whole SITUATION (person, conversation,
   photo, website, money request, something else) instead of one message.
   Everything here runs on this device. It does not search the web, run
   picture searches, or verify anyone. The AI reads only what the person
   shared, and the result separates what they told us, the AI's analysis,
   possible matches (none yet), and what is unknown.
   ===================================================================== */
var TrustCheck={
LEVELS:{
high:{label:'HIGH CONCERN',c:'#FF8A8A',ic:'alert-triangle'},
some:{label:'SOME WARNING SIGNS',c:'#F5C56B',ic:'alert-triangle'},
low:{label:'LOW CONCERN',c:'#3DF0D0',ic:'shield-check'},
unknown:{label:'NOT ENOUGH INFORMATION YET',c:'#9DBBFF',ic:'help-circle'}
},
KEYS:{'HIGH CONCERN':'high','SOME WARNING SIGNS':'some','SOME CONCERN':'some','LOW CONCERN':'low','NOT ENOUGH INFORMATION YET':'unknown','NOT ENOUGH INFORMATION':'unknown'},
CONT:['person_story','payment','scam_story','scam_followup','check_message','check_link','check_picture','check_person','maybe_check_message','image_trace','image_auth','check_ask','check_link_ask','check_picture_ask','unsure_help'],
START:['person_story','payment','scam_story','scam_followup'],
/* what kinds of things the person mentioned (basic keyword detection) */
subjects:function(t,hasImg){
var R=Intent.re,T=Concierge.topics(t),s=[];
if(T.person)s.push('a person');
if(/\b(chat(ting|ted)?|messages?|messaged|texts?|texted|dm|dms|conversation|calls?|called|emailed|voice\s*note|whatsapp|telegram)\b/i.test(t))s.push('a conversation');
if(hasImg||T.pic)s.push('a photo');
if(R.url.test(t)||R.linkWord.test(t))s.push('a website or link');
if(T.money)s.push('a money request');
if(/\b(says?|said|claims?|claimed|told me|tells me|promis\w+|guarantee\w*|offers?|offered)\b|\b(works?|working)\s+(as|in|for|at|on)\b|\b(nurse|doctor|soldier|engineer|lawyer|officer|general|surgeon|widow|widower|manager|agent|broker|trader|banker|captain|colonel)\b/i.test(t))s.push('claims about who they are or what they offer');
return s;
},
/* decide if this message belongs to a TrustCheck conversation */
learn:function(t,route,T,hasImg){
var ctx=S.cur.ctx;route.tc=false;
if(!ctx.mode){ctx.tc=null;return}
if(ctx.mode==='emergency'||route.intent==='emergency')return;
if(this.CONT.indexOf(route.intent)<0)return;
var subs=this.subjects(t,hasImg);
if(!ctx.tc){
if(this.START.indexOf(route.intent)<0)return;
if(!(subs.length>=2||String(t).length>=70))return;
ctx.tc={subs:{},turns:0};
}
subs.forEach(function(k){ctx.tc.subs[k]=1});
/* investigation: remember what kinds of evidence were actually shared (never checked) */
var ev=ctx.tc.ev=ctx.tc.ev||{};var um=String(t).match(Intent.re.url);
if(um)ev['a link or website ('+um[0].slice(0,60)+')']=1;
if(hasImg)ev['a picture']=1;
if(subs.indexOf('a conversation')>=0)ev['messages or conversation details']=1;
if(subs.indexOf('a money request')>=0)ev['a money request']=1;

route.tc=true;
},
note:function(route){
if(!route||!route.tc)return '';

},
foot:function(){

},
chip:function(inner){

if(k.indexOf('claims made')===0)return['fact','Claimed'];
if(k.indexOf('evidence you gave')===0)return['fact','You provided'];
if(k.indexOf('warning signs')===0||k.indexOf('how it fits')===0)return['ai','AI analysis'];
if(k.indexOf('why')===0)return['ai','AI analysis'];
if(k.indexOf("what we don't know")===0||k.indexOf("what i don't know")===0||k.indexOf('what we do not know')===0)return['unk','Unknown'];

},
decorate:function(html){

},
/* split the level line from the body and label the sections */

var lines=String(body).split('\n'),i=0;
while(i<lines.length&&!lines[i].trim())i++;
var key=(lines[i]||'').replace(/^[*_#\s]+/,'').replace(/[*_#:.\s]+$/,'').replace(/\s+/g,' ').toUpperCase();

var level=lvl||(tag&&this.LEVELS[tag]?tag:'unknown');

},
/* while the reply is still arriving */

return v.isTc?this.head(v.level)+v.html:md(body);
}
};

/* =====================================================================
   EVIDENCE CHAIN (part of the Investigation)
   For important claims: CLAIM > EVIDENCE > WHAT IT SHOWS > WHAT IT DOES
   NOT PROVE > STATUS. The AI fills it only from what the person shared.
   The app cleans the text and keeps the status honest: ScamSense verifies
   nothing itself, so VERIFIED is shown only if the person said they
   confirmed it themselves. Nothing here is a search or a verification.
   ===================================================================== */
var EvidenceChain={
ST:{verified:['VERIFIED','ec-verified'],partial:['PARTIALLY SUPPORTED','ec-partial'],unverified:['UNVERIFIED','ec-unverified'],conflict:['CONFLICTING','ec-conflict'],unknown:['UNKNOWN','ec-unknown']},
clean:function(x,n){return String(x||'').replace(/<[^>]*>/g,'').replace(/[<>\[\]]/g,'').replace(/\s+/g,' ').trim().slice(0,n||160)},
status:function(x,said){
var k=String(x||'').toLowerCase();
if(/unverif|not verif/.test(k))return 'unverified';
if(/partial|some support/.test(k))return 'partial';
if(/conflict|contradict/.test(k))return 'conflict';
if(/verif|confirm/.test(k))return /(confirm|verif|checked|phoned|called|official|spoke to|spoke with)/i.test(said||'')?'verified':'unverified';
if(/unknown/.test(k))return 'unknown';
return 'unverified';
},
parse:function(raw,userText){
if(!raw)return null;
var self=this,out=[];
String(raw).split(';;').forEach(function(part){
var f=part.split('|');
if(f.length<5||out.length>=4)return;
var claim=self.clean(f[0],140),ev=self.clean(f[1]),sh=self.clean(f[2]),np=self.clean(f[3]);
if(!claim||!ev)return;
out.push({claim:claim,evidence:ev,shows:sh||'Only that the claim was made.',notProve:np||'It does not independently confirm the claim.',status:self.status(f[4],userText)});
});
return out.length?out:null;
},
html:function(ch,inCase){
var self=this,row=function(k,v){return '<div class="ec-k">'+k+'</div><div class="ec-v">'+esc(v)+'</div><div class="ec-a" aria-hidden="true">↓</div>'};
var cards=ch.map(function(c){
var st=self.ST[c.status]||self.ST.unverified;
return '<div class="ec-c">'+row('Claim','“'+c.claim+'”')+row('Evidence',c.evidence)+row('What it shows',c.shows)+row('What it does not prove',c.notProve)+'<div class="ec-k">Status</div><span class="ec-st '+st[1]+'">'+st[0]+'</span></div>';
}).join('');
if(inCase)return '<div class="ec" role="group" aria-label="Evidence chain" style="margin:0 0 8px">'+cards+'</div>';
