/* =====================================================================
   CHALLENGE THE STORY (part of the Investigation)
   Looks at the important claims in the story: what is claimed, what would
   need to be true, what the person could check, what is known, and what is
   still unknown. It never calls anyone a liar, never treats "unknown" as
   "false", and never says ScamSense searched or verified anything. The app
   cleans the text and drops anything that sounds like an accusation or
   like a search the app did not run. Reuses the Evidence Chain card style.
   ===================================================================== */
var StoryChallenge={
ACCUSE:/\b(liar|liars|lying|lies|lied|fake|fraud|fraudster|scammer|criminal|crook|con\s*artist)\b/i,
DID:/\b(i|we|scamsense)\s+(have\s+)?(searched|checked|verified|confirmed|looked\s+up|found|matched|opened|scanned)\b/i,
parse:function(raw){
if(!raw)return null;
var self=this,out=[];
String(raw).split(';;').forEach(function(part){
var f=part.split('|');
if(f.length<5||out.length>=4)return;
var c=f.slice(0,5).map(function(x){return EvidenceChain.clean(x,170)});
if(!c[0]||!c[1])return;
if(self.ACCUSE.test(c.join(' ')))return;
out.push({claim:c[0].slice(0,140),need:c[1],check:self.DID.test(c[2])?'You could ask them for independent proof, or contact the organisation through details you already trust.':(c[2]||'You could ask for independent proof, or check through details you already trust.'),known:self.DID.test(c[3])?'Only what you have told me.':(c[3]||'Only what you have told me.'),unknown:c[4]||'Whether the claim is true. Not knowing is not proof that it is false.'});
});
return out.length?out:null;
},
html:function(ch,inCase){
var row=function(k,v,last){return '<div class="ec-k">'+k+'</div><div class="ec-v">'+esc(v)+'</div>'+(last?'':'<div class="ec-a" aria-hidden="true">↓</div>')};
var cards=ch.map(function(c){
return '<div class="ec-c">'+row('They claim','“'+c.claim+'”')+row('To support that story',c.need)+row('What you could check',c.check)+row('Currently known',c.known)+row('Still unknown',c.unknown,1)+'<span class="ec-st ec-unverified" style="margin-top:6px">Not independently verified</span></div>';
}).join('');

return '<div class="ec" role="group" aria-label="Challenge the story"><div class="ec-t">Challenge the story</div><div class="ec-s">A look at what would need to be true for each claim. Not knowing is not proof a claim is false, and nothing here was searched or verified by ScamSense.</div>'+cards+'</div>';
}
};

/* =====================================================================
   IDENTITY CONFLICT FINDER (part of the Investigation)
   Shows places where two identity claims the person already told us
   (location, job, name, age, history) do not fit together. A conflict
   never proves anyone is a scammer. The app drops anything that accuses
   someone, says two people are the same person, matches a photo, or
   claims a search or check that did not happen. Reuses the card styles.
   ===================================================================== */
var IdentityConflict={
BLOCK:/\b(same\s+(person|man|woman|guy|profile|people)|looks?\s+like|resembles?|matches|is\s+actually|real\s+name\s+is|identical)\b/i,

if(!raw)return null;

String(raw).split(';;').forEach(function(part){
var f=part.split('|');
if(f.length<3||out.length>=3)return;
var c=f.slice(0,3).map(function(x){return EvidenceChain.clean(x,170)});
if(!c[0]||!c[1]||!c[2])return;
var all=c.join(' ');
if(StoryChallenge.ACCUSE.test(all)||StoryChallenge.DID.test(all)||self.BLOCK.test(all))return;

});
return out.length?out:null;
},
html:function(cf,inCase){
var row=function(k,v,last){return '<div class="ec-k">'+k+'</div><div class="ec-v">'+esc(v)+'</div>'+(last?'':'<div class="ec-a" aria-hidden="true">↓</div>')};
var cards=cf.map(function(c){
return '<div class="ec-c">'+row('Claim 1','“'+c.a+'”')+row('Claim 2','“'+c.b+'”')+row('Why it conflicts',c.why,1)+'<div class="ec-k" style="margin-top:6px">Status</div><span class="ec-st ec-partial">Needs verification</span></div>';

}
};

/* =====================================================================
   SCAM PATTERN MAP (part of TrustCheck)
   A small card that shows HOW a situation may be developing. The AI may
   only list steps from what the person actually told it. The app checks
   the shape, cleans the text, works out "you are here" itself, and
   labels steps that were not mentioned as unknown. It never says a
   pattern proves anyone is a scammer.

var PatternMap={
parse:function(raw,level){

/* =====================================================================

{k:'onlychance',w:1,label:'“Only chance” talk',re:/\b(only chance|last chance|final chance|once[- ]in[- ]a[- ]lifetime|limited (time|spots|slots|offer)|(spots|slots|places) (are )?(almost )?(gone|filling|running out)|offer (ends|expires)|won'?t last|never get (another|this)|miss (out|this)|(this|it) (is|will be) your (only|last) (chance|opportunity|offer|option))\b/i},
{k:'secrecy',w:2,label:'Secrecy',re:/\b(don'?t tell|do not tell|not (to )?tell (anyone|(your|my|the) \w+)|keep (this|it|that) (a )?(secret|between us|private|quiet|to yourself)|between (you and me|us)|tell (no ?one|nobody)|(no ?one|nobody) (needs to|should|must) know|don'?t (mention|talk to) (it|this|anyone|your (family|bank|wife|husband|children|kids))|confidential)\b/i},
{k:'threat',w:2,label:'Fear or threats',re:/\b(or else|you (will|'ll|are going to) (lose|be arrested|go to (jail|prison)|be sued|be charged|be in (trouble|big trouble))|lose everything|arrest(ed)?|jail|prison|warrant|lawsuit|legal action|(police|the police) (will|are)|(freeze|freezing) (your )?(bank )?account|account (will be|has been|is being) (closed|frozen|suspended|blocked|deleted)|(deport(ed)?|deportation)|(i|we)('ll| will) (expose|leak|post|share|ruin|report) (you|your|this|the)|expose you|ruin you)\b/i},
{k:'guilt',w:1,label:'Guilt or emotional pressure',re:/\b(if you (really )?(love|trust|care)|you promised|i'?m begging|i beg you|please i beg|don'?t you trust me|you('re| are) (my|the) only (one|hope|person)|after all (i|we)('ve| have)? ?done|you owe me|you have no choice|no choice but)\b/i},
{k:'nocheck',w:2,label:'Discouraged from checking',re:/\b(don'?t (ask|check|verify|call|google|research|question)\b[^.?!]{0,30}|stop asking( me)?( questions)?|no time (to|for) (check|verify|ask|think)|(there'?s|there is) no need to (check|verify|call|ask)|don'?t (call|contact|tell) (the |your )?(bank|police|family|friends?))/i}
],
KEYMAP:[['urgency',/urgen|hurry|rush|deadline|fast|quick|time/i],['onlychance',/only chance|last chance|scarc|limited|miss out|once/i],['secrecy',/secre|private|hide|hidden|conceal|confiden/i],['threat',/threat|fear|scare|arrest|legal|lose|punish|intimid/i],['guilt',/guilt|emotion|manipul|pity|love|trust|beg/i],['nocheck',/check|verify|question|discourag|isolat/i]],
clean:function(x,n){return String(x||'').replace(/<[^>]*>/g,'').replace(/[<>\[\]|]/g,'').replace(/\s+/g,' ').trim().slice(0,n)},
/* the person's own typed words in this chat (latest few) */
userText:function(){
var out=[];
try{(S.cur.api||[]).forEach(function(m){
if(m.role!=='user')return;
var c=m.content;
if(Array.isArray(c))c=c.filter(function(p){return p.type==='text'}).map(function(p){return p.text}).join(' ');

},

var t=String(text||'').split(/(?<=[.!?\n])\s+/).filter(function(x){return !/^\s*(should|can|could|do|is|would|will|am|may|shall)\s+i\b/i.test(x)&&!/^\s*i\s+(want|need|plan|would like|am (going|about) )\s*to\b/i.test(x)}).join(' '),found=[];

/* the AI's optional tag: "level ;; Label|note ;; Label|note" */
parseTag:function(raw){
var out={hint:'',signs:[]};
if(!raw)return out;
var parts=String(raw).split(';;');
var lv=PressureMeter.clean(parts[0],20).toLowerCase();
if(lv==='low'||lv==='moderate'||lv==='high')out.hint=lv;

/* =====================================================================
   ACTION PLAN (part of TrustCheck)
   A short list of practical next steps, chosen on this device from what
   the person actually said (money sent, password or code shared,
   documents shared) or, if none of that, a gentle "check first" plan.
   Never blames the person. Never says anyone is a scammer.
   ===================================================================== */
var ActionPlan={
SETS:{
sent:{label:'If money was already sent',steps:['Contact your bank or payment provider now.','Keep the receipts and messages.','Do not send more money.']},
pass:{label:'If a password or code was shared',steps:['Change the password.','Turn on two-step verification.','Do not share verification codes.']},
docs:{label:'If documents were shared',steps:['Keep a record of what was sent.','Watch for suspicious activity.']},
hold:{label:'Money has been asked for, not sent',steps:['Don’t send money yet.','Verify the situation first.']},
check:{label:'Next steps',steps:['Take your time before replying or acting.','Check using contact details you already trust.','Talk it over with someone you trust.']}
},
RE:{
sent:/\b(sent|paid|transferred|wired|deposited|gave)\b(?!\s+(me|us)\b)[^.?!]{0,40}(?:\b(?:money|cash|funds?|payment|naira|usd|dollars?|gift ?cards?|bitcoin|crypto|fee)\b|\$\s?\d|₦\s?\d)|\balready\s+(paid|transferred|wired)\b|\bi\s+(have\s+|'ve\s+)?(paid|transferred|wired)\b/i,
pass:/\b(gave|shared|told|handed|provided|typed|entered|sent|read\s+out)\b(?!\s+(me|us)\b)\s+(\w+\s+){0,4}(my|the|our)\s+(\w+\s+)?(password|pass\s?word|passcode|pin|otp|verification\s*code|security\s*code|login\s*details|log-?in\s*details|code)\b/i,

/* only what the person said happened; skip questions, plans and "haven't" sentences */
detect:function(text){
var t=String(text||'').replace(/[\u2018\u2019]/g,"'"),out={sent:false,pass:false,docs:false};
t.split(/(?<=[.!?\n])\s+/).forEach(function(x){

case 'soon':say('<p style="margin:0">That part is planned and isn’t in this prototype yet. If you think you’ve been scammed right now, contact your bank or the service directly, using contact details from their official site or card.</p>');go('chat');break;
case 'helpme':say('<p style="margin:0">Paste a message or link, add a screenshot with the picture button, or tap the plus button for more options. You can also just chat with me. If you’re in danger or have lost money, contact your bank or local authorities directly.</p>');go('chat');break;

case 'report':say('<p style="margin:0">This prototype can’t send reports. You can report it to the app or platform where it arrived, and to your bank if money or card details are involved. Use the official contact details you find yourself.</p>');render();break;
case 'hist':S.cur=S.sessions[+arg];go('chat');break;
}
}

/* =====================================================================
   PROOFCHECK (part 5): "Is This Proof Really Proof?"
   Helps a person examine a screenshot, receipt, invoice, certificate,
   message, profile or other material that someone is using as "proof".
   Everything here runs on this device. It does NOT run a reverse image
   search, a forensic scan, or any lookup with a bank, issuer or platform.
   It never calls anything fake. It keeps four things apart:
   FACT (seen directly), AI ANALYSIS (ScamSense's reading, can be wrong),
   POSSIBLE MATCH (similar to something else, not confirmation) and
   UNKNOWN (cannot be checked from here).
   ===================================================================== */
var PF_TYPES={
receipt:{label:'Payment receipt',icon:'wallet',
shows:'At most, this shows an image or text that looks like a payment confirmation.',

verify:['Whether the money has really arrived. Open your own bank or payment app yourself, not through a link, and look at your balance and history.','Whether the reference number appears in your own records.','Whether the name and account on it match who you expect.'],
signs:[
{re:/\b(pending|processing|awaiting|in progress|queued|will (reflect|arrive|be credited|clear))\b/i,label:'Status is not final',find:'It mentions a payment that is pending or still processing. That is not the same as money received.'},
{re:/(over-?paid|sent (too much|extra)|extra (money|amount|funds)|send back (the )?(difference|balance|extra|rest)|refund (me )?(the )?(difference|balance|extra|rest))/i,label:'Asks you to send some back',find:'The story involves returning an “extra” amount. A real payment does not need you to send money back before it clears.'}]},

signs:[
{re:/(new|changed|updated|different) (bank|account|payment) (details|number|info)/i,label:'Payment details changed',find:'It mentions new or changed payment details. That is worth confirming with the business directly.'},
{re:/(overdue|final (notice|demand)|pay (today|now|immediately)|late fee)/i,label:'Pushes for quick payment',find:'The wording pushes for quick payment.'}]},

shows:'At most, this shows a document that says someone holds a qualification, licence or identity.',
not:['That the organization named on it actually issued it.','That the person named is the person who showed it to you.','That it is real, current or still valid.'],
verify:['Whether the issuer issued it. Find the issuer’s official website yourself and use its verification service or contact page.','Whether the number appears in an official register, if one exists.','Whether the details match the person you are dealing with. ScamSense Verify can show a live person took part, but it does not confirm identity.'],
signs:[
{re:/(instant|no exam|no training|buy (a )?(certificate|degree|licen[cs]e)|without (study|exam))/i,label:'Easy to get',find:'It mentions getting this instantly or without study. That is worth checking against the issuer.'}]},

shows:'At most, this shows an image or text of a conversation as someone chose to show it.',

shows:'At most, this shows what an account or page displays right now.',
not:['That the person is real or who they say they are.','That followers, likes, reviews or posts are genuine.','That the account is old, or has not been taken over.'],

shows:'At most, this shows numbers on a screen. It does not show where they came from.',
not:['That any money was really made. Numbers on a screen or dashboard can be typed in or controlled by whoever runs the site.','That the platform is real, licensed or lets people withdraw.','That other people got the results shown.'],

signs:[
{re:/(guaranteed|risk[- ]free|double your|daily (profit|returns?)|\d{2,}% )/i,label:'Results that sound too good',find:'It mentions guaranteed or very large returns. That is a known warning sign.'},
{re:/(withdraw(al)? (fee|tax)|(pay|send) (a )?(fee|tax|deposit) (to|before) (withdraw|unlock)|unlock (your )?(funds|withdrawal))/i,label:'Fee to get money out',find:'It mentions paying something before you can withdraw. That is a known warning sign.'}]},

};
var PF_ORDER=['receipt','invoice','chat','profile','certificate','profit','other'];
var PF_STEPS=['Reading what you gave me','Looking at the file details','Comparing with what you saved','Sorting facts from guesses'];
var PF_LEVELS={
info:{name:'Not enough information yet',color:'#8FA0C8',text:'There isn’t enough here to say much. Adding the words from it, or where it came from, would help.'},
none:{name:'No clear warning signs seen',color:'#7FE6CF',text:'That does not mean it is genuine. It only means nothing stood out in what you gave me.'},
some:{name:'Some warning signs',color:'#F5C56B',text:'There are things here worth checking before you rely on this.'},
high:{name:'High concern',color:'#FF7B7B',text:'Several things here are worth checking before you rely on this or act on it.'}
};
S.pf={type:'',img:null,stage:'setup',res:null,from:'home',pressure:'',money:'',in:null};

function pfTag(k){var n={FACT:'FACT',AI:'AI ANALYSIS',MATCH:'POSSIBLE MATCH',UNK:'UNKNOWN'};return '<span class="pf-t pf-'+k+'">'+n[k]+'</span>'}
function pfRow(k,h){return '<div class="pf-r">'+pfTag(k)+'<div>'+h+'</div></div>'}
function pfClip(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}
function pfPlain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,'\'')}
function pfDigits(a){return String(a).replace(/\D/g,'').replace(/^0+/,'')}
function pfAmounts(t){var m=String(t||'').match(new RegExp(AMOUNT_RE.source,'gi'))||[],seen={},out=[];m.forEach(function(x){var d=pfDigits(x);if(d&&!seen[d]){seen[d]=1;out.push(x.trim())}});return out}

/* ----- the check itself: only reads what the person gave, plus things saved inside this app ----- */
async function pfAnalyze(P){
var N=P.in,T=PF_TYPES[N.type]||PF_TYPES.other,meta=null;
if(P.img){
try{meta=await analyzeMeta(P.img.file,P.img.url)}catch(e){meta=null}
if(!P.img.hash){try{P.img.hash=await dHash(P.img.url)}catch(e){}}
}
var told=[N.claim,N.source].filter(Boolean).join(' . '),facts=[],reading=[],signs=[],matches=[],unk=[],next=[];
/* FACT: what was directly given */
if(N.claim)facts.push('You told me it is being used to show: “'+esc(pfClip(N.claim,200))+'”.');
if(N.source)facts.push('You told me it came from: “'+esc(pfClip(N.source,200))+'”.');
if(N.text)facts.push('You pasted '+N.text.length+' characters of text from it.');
if(P.img){facts.push('You added one picture.');if(meta&&meta.found)meta.found.forEach(function(f){facts.push(f)})}
var amT=pfAmounts(N.text),amC=pfAmounts(N.claim);
if(amT.length)facts.push('Amounts that appear in the text: '+esc(amT.slice(0,4).join(', '))+'.');
if(!facts.length)facts.push('You haven’t given me anything to read yet.');
/* AI ANALYSIS: ScamSense's reading */
reading.push(T.shows);
reading.push('Proof does not settle whether a request is safe. Real proof can be used in a scam, and weak proof can still be honest. What counts is whether it can be checked independently.');
if(amT.length>1)reading.push('More than one amount appears. It is worth checking which one is the real figure.');
if(P.img&&!N.text)reading.push('This device can’t read the words inside a picture. Paste the text, or use “Ask ScamSense AI”, which can read the picture but can also make mistakes.');
/* warning signs */
var seenL={};
function addSign(label,find){if(seenL[label])return;seenL[label]=1;signs.push({label:label,find:find})}
Rules.forEach(function(r){
var m=N.text.match(r.re),where='in the text you pasted';
if(!m){m=told.match(r.re);where='in what you told me'}
if(m){var l=r.label.charAt(0).toUpperCase()+r.label.slice(1);addSign(l,'The wording '+where+' includes “'+esc(m[0].trim())+'”. This often appears in scams, but it can also appear in honest messages.')}
});
T.signs.forEach(function(s){if(s.re.test(N.text)||s.re.test(told))addSign(s.label,s.find)});
if(amT.length&&amC.length){
var dT=amT.map(pfDigits),overlap=amC.some(function(a){return dT.indexOf(pfDigits(a))>-1});
if(!overlap)addSign('Amounts differ','The amount in what you told me ('+esc(amC[0])+') does not appear in the pasted text ('+esc(amT.slice(0,2).join(', '))+'). This could be a typo or a different payment, so it is worth checking.');
}
if(P.pressure==='yes')addSign('Pressure','You said they are pushing you to act quickly. Anyone with real proof should be fine with you taking time to check it.');
if(P.money==='yes')addSign('Asked to act because of it','You said you are being asked to send money or something else because of this. Proof shown during a request is a reason to check, not a reason to hurry.');
if(meta&&(meta.cat==='ai_strong'||meta.cat==='ai_edit'||meta.cat==='conv'))addSign('File details worth asking about','The file’s own details mention editing or generation tools (see the facts above). That can have an innocent explanation, like a filter, a crop or an app. It does not show the picture is fake.');
/* POSSIBLE MATCH: only comparisons against things saved in this app */
function simHash(h){return h&&P.img&&P.img.hash&&ham(h,P.img.hash)<=6}
S.cases.forEach(function(c){c.items.forEach(function(it,i){
if(matches.length>=4)return;
if(it.type==='picture'&&simHash(it.hash))matches.push('This picture looks visually similar to item #'+(i+1)+' in your case “'+esc(c.title)+'”. This is a basic comparison only. Similar is not the same as identical.');
var d=(it.detail||'')+' '+(it.title||'');
pfAmounts(N.text+' '+N.claim).forEach(function(a){if(matches.length<4&&pfDigits(a).length>=3&&pfDigits(d).indexOf(pfDigits(a))>-1&&d.toLowerCase().indexOf(a.toLowerCase().replace(/\s/g,''))>-1)matches.push('The amount “'+esc(a)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
(N.text.match(/\b\d{8,}\b/g)||[]).forEach(function(n){if(matches.length<4&&d.indexOf(n)>-1)matches.push('The number “'+esc(n)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
(N.text.match(/[\w.+-]+@[\w-]+\.[\w.]+/g)||[]).forEach(function(n){if(matches.length<4&&d.toLowerCase().indexOf(n.toLowerCase())>-1)matches.push('The address “'+esc(n)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
})});
if(matches.length<4){var seenImg=[];(S.trace.imgs||[]).forEach(function(o){seenImg.push({h:o.hash,w:'a picture you traced earlier'})});if(S.auth&&S.auth.img)seenImg.push({h:S.auth.img.hash,w:'a picture you checked for authenticity earlier'});
seenImg.forEach(function(o){if(matches.length<4&&o.h&&P.img&&P.img.hash&&ham(o.h,P.img.hash)<=6&&P.img.url!==undefined)matches.push('This picture looks visually similar to '+o.w+'. This is a basic comparison only.')})}
/* UNKNOWN */
T.verify.forEach(function(v){unk.push(esc(v))});
unk.push('Whether the person who gave you this is who they say they are.');
unk.push('Whether anything was cropped, changed or left out. We cannot verify this from the information available.');
if(!N.source)unk.push('Where it came from. You didn’t say who gave it to you or how.');
if(!N.claim)unk.push('What it is being used to show. You didn’t say.');
if(P.img&&!N.text)unk.push('What the words in the picture say. They were not read on this device.');
/* next steps */
var money=P.money==='yes'||P.money==='unsure'||['receipt','invoice','profit'].indexOf(N.type)>-1;
if(money)next.push(MoneyFirewall.SAFE);
next.push('Check it yourself, using details you find on your own, like an official site, the app on your phone, or the number on your card. Don’t use details from the proof itself.');
if(['chat','profile','certificate','other'].indexOf(N.type)>-1)next.push('Ask the person to confirm in a way that can be checked, like a live video call or a question only they could answer.');
if(signs.length>=2||P.money==='yes')next.push('Talk to your bank, or someone you trust, before you act on it.');
next.push('Keep it in a case, with where it came from and when you got it.');
var n=signs.length,lv=n>=3?'high':(n>=1?'some':((!N.text&&!N.claim)?'info':'none'));
var top=signs.slice(0,3).map(function(s){return s.label}).join(', ');
var sum='ProofCheck on a '+T.label.toLowerCase()+': '+PF_LEVELS[lv].name.toLowerCase()+(top?' ('+top+')':'')+'. Nothing was verified. It does not prove the person is telling the truth.';
return{T:T,N:N,facts:facts,reading:reading,signs:signs,matches:matches,unk:unk,next:next,level:lv,money:money,sum:sum,hasImg:!!P.img};
}

/* ----- result screen ----- */
function pfResult(){
var P=S.pf,R=P.res,L=PF_LEVELS[R.level],h='';
h+=title('ProofCheck','What this proof can and cannot tell us');
h+='<div style="border:1px solid '+L.color+';background:#0E1A3C;border-radius:16px;padding:14px;margin:0 0 12px"><div style="font-size:18px;font-weight:600;color:'+L.color+'">'+L.name+'</div><div style="margin-top:4px">'+L.text+'</div><div class="rs" style="margin-top:6px">Nothing here has been verified. We cannot verify this from the information available.</div></div>';
if(R.money)h+='<div class="warnbox" style="margin:0 0 12px">'+I('shield-check','aria-hidden="true" style="font-size:20px"')+'<div style="font-weight:600">'+MoneyFirewall.SAFE+'</div></div>';
h+='<details class="pf-leg"><summary>How to read the labels</summary><div class="pf-lg">'+pfRow('FACT','Seen directly in what you gave me.')+pfRow('AI','ScamSense’s own reading. It can be wrong.')+pfRow('MATCH','Similar to something else. Not a confirmation.')+pfRow('UNK','Can’t be checked from here.')+'</div></details>';
h+=sect('1. What it shows');
R.facts.forEach(function(f){h+=pfRow('FACT',f)});
R.reading.forEach(function(f){h+=pfRow('AI',esc(f))});
h+=sect('2. What it does not prove');
h+=pfRow('AI','This does not prove that the person is telling the truth.');
R.T.not.forEach(function(f){h+=pfRow('AI',esc(f))});
h+=sect('3. Warning signs I can see');
if(R.signs.length){R.signs.forEach(function(s){h+=pfRow('AI','<b style="font-weight:600">'+esc(s.label)+'</b>: '+s.find)});h+='<div class="rs" style="margin:0 0 10px">These are reasons to check, not proof that anyone is lying.</div>'}
else h+=pfRow('AI','I didn’t see clear warning signs in what you gave me. That does not mean it is genuine.');
h+=sect('4. Possible matches');
if(R.matches.length)R.matches.forEach(function(m){h+=pfRow('MATCH',m)});
h+=pfRow('FACT',(R.matches.length?'These were compared only with things saved in this app. ':'No possible matches found among things saved in this app. ')+'No reverse image search or public records search is connected, so nothing outside this app was checked.');
h+=sect('5. Still unknown: needs independent checking');
R.unk.forEach(function(u){h+=pfRow('UNK',u)});
h+=sect('6. What to do next')+bullets(R.next.map(esc));
h+='<div class="rs" style="margin:6px 0 14px">I’m not saying anything here is fake or that anyone is lying. I’m only showing what your information does and does not support.</div>';
h+=prim('Ask ScamSense AI to look closer','pf-ai')+sec('Add to a case','pf-case');
if(R.hasImg)h+=sec('Trace this picture','pf-trace')+sec('Check picture authenticity','pf-auth');
if(P.money==='yes')h+=sec('Check the payment request','money-open');
h+=sec('Start over','pf-reset')+sec('Back to chat','chat');
return h;
}

/* ----- setup screen ----- */
function pfChips(items,sel,act){return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">'+items.map(function(o){return '<button class="chip" data-act="'+act+'" data-arg="'+o[0]+'"'+(sel===o[0]?' aria-pressed="true" style="background:#14D3B0;color:#04222A;border-color:#14D3B0"':' aria-pressed="false"')+'>'+o[1]+'</button>'}).join('')+'</div>'}
Views.proof=function(){
var P=S.pf;
if(P.stage==='run')return title('Looking closely','Checking what you gave me')+'<div class="rs" style="margin:0 0 12px">Basic checks on this device. Nothing is sent anywhere.</div>'+stepsView(PF_STEPS,S.stepIdx||0);
if(P.stage==='done'&&P.res)return pfResult();
var tile=P.img?'<div class="thr"><div class="th"><img src="'+P.img.url+'" alt="Picture you added"><button class="ib" data-act="pf-rm" aria-label="Remove picture">'+I('x','aria-hidden="true"')+'</button></div></div>':'<button class="th add" data-act="pf-img" style="width:100%;height:84px;margin:0 0 14px" aria-label="Add a screenshot or photo">'+I('upload','aria-hidden="true" style="font-size:24px"')+'<span>Add a screenshot or photo</span></button>';
return vm()+title('ProofCheck','Is this proof really proof?')
+'<div style="margin:0 0 12px">Someone showed you a screenshot, receipt, document or profile as proof. Let’s look at what it really shows, and what it doesn’t.</div>'
+sect('What kind of proof is it?')+pfChips(PF_ORDER.map(function(k){return [k,PF_TYPES[k].label]}),P.type,'pf-type')
+sect('What are they using it to show?')+fld('pf.claim','For example, “that he already paid me”',2)
+sect('Where did it come from?')+fld('pf.source','Who gave it to you, and how?')
+sect('Add what you have')+tile
+'<div class="rs" style="margin:-6px 0 8px">Or paste the words from it:</div>'+fld('pf.text','Paste any text from the proof',4)
+sect('Are they pushing you to act quickly?')+pfChips([['yes','Yes'],['no','No'],['unsure','Not sure']],P.pressure,'pf-p')
+sect('Are you being asked to send money or something else because of it?')+pfChips([['yes','Yes'],['no','No'],['unsure','Not sure']],P.money,'pf-m')
+prim('Look closely at this proof','pf-run')
+'<div class="rs" style="text-align:center">Basic checks on this device. I can’t run a reverse image search or forensic scan, or ask a bank or issuer. I won’t call anything fake without solid evidence.</div>';
};

/* ----- flows ----- */
Flow['pf-open']=function(from){
S.pf={type:'',img:null,stage:'setup',res:null,from:from||'home',pressure:'',money:'',in:null};
['claim','source','text'].forEach(function(k){S.f['pf.'+k]=''});
var li=from==='chat'&&S.cur.ctx.lastImg;
if(li){var o={file:li.file,url:li.url,hash:null};S.pf.img=o;dHash(o.url).then(function(h){o.hash=h})}
go('proof');
};
Flow['pf-type']=function(k){S.pf.type=(S.pf.type===k?'':k);render()};
Flow['pf-p']=function(v){S.pf.pressure=(S.pf.pressure===v?'':v);render()};
Flow['pf-m']=function(v){S.pf.money=(S.pf.money===v?'':v);render()};
Flow['pf-img']=function(){var el=$('#pffile');if(el)el.click()};
Flow['pf-rm']=function(){S.pf.img=null;render()};
Flow['pf-reset']=function(){Flow['pf-open'](S.pf.from)};
Flow['pf-run']=function(){
var P=S.pf,claim=(S.f['pf.claim']||'').trim(),src=(S.f['pf.source']||'').trim(),text=(S.f['pf.text']||'').trim();
if(!P.img&&!text&&!claim){S.vmsg='Add the picture, paste the words from it, or say what it is being used to show.';render();return}
P.in={type:P.type||'other',claim:claim,source:src,text:text};
P.stage='run';P.res=null;
var pr=pfAnalyze(P);
runSteps(PF_STEPS,650,function(){pr.then(function(r){P.res=r;P.stage='done';try{pfReport(P,r)}catch(e){}go('proof')},function(){P.stage='setup';S.vmsg='Something went wrong while reading that. Please try again.';go('proof')})});
};

/* a short, honest summary goes into the chat, like the other tools do */
function pfReport(P,R){
var c=S.cur,f=Concierge.facts(),lbl=R.T.label.toLowerCase(),L=PF_LEVELS[R.level],acts=[];
var txt=['I’ve looked closely at the '+lbl+' you showed me.','','**'+L.name+'**','Nothing here has been verified, and it does not prove the person is telling the truth.'];
if(R.signs.length){txt.push('','**What stood out**');R.signs.slice(0,3).forEach(function(s){txt.push('- '+s.label+': '+pfPlain(s.find))})}
txt.push('','**What I’d verify first**','- '+pfPlain(R.unk[0]));
if(R.money)txt.push('','**'+MoneyFirewall.SAFE+'**');
txt.push('','This was a basic check on this device. I can’t tell you it is real or fake.');
var raw=txt.join('\n');
ensureSession('ProofCheck');
f.done.proof=true;f.results.push(R.sum);if(f.results.length>6)f.results.shift();
if(P.money==='yes')acts.push('check_payment');acts.push('what_do');
c.ctx.mode=c.ctx.mode||'scam';c.ctx.since=0;
var note='[App note: the person just used the ProofCheck tool. Result: '+R.sum+']';
var last=c.api[c.api.length-1];
if(last&&last.role==='user'&&typeof last.content==='string')last.content+='\n'+note;else c.api.push({role:'user',content:note});
c.api.push({role:'assistant',content:raw});
c.msgs.push({role:'ai',html:md(raw),raw:raw,actions:acts.slice(0,3)});
}

/* ----- the chat AI is told how to handle ProofCheck turns ----- */

p.turns++;

return '\n[PROOFCHECK ACTIVE (from the app, never mention it): the person wants to know whether something being used as proof is really proof. Use the ProofCheck format from your instructions. They say it is a '+p.label+(p.claim?'. It is being used to show: '+p.claim:'')+(p.source?'. It came from: '+p.source:'')+(p.pressure==='yes'?'. They are being pushed to act quickly':'')+(p.money==='yes'?'. They are being asked to send money or something else because of it':'')+'.'+(p.text?' Text they pasted from it: "'+p.text+'".':'')+' Basic on-device facts (not verification): '+p.facts+'.'+(p.signs?' On-device warning signs: '+p.signs+'.':'')+(p.matches?' Matches inside this app only: '+p.matches+'.':' There are no matches from any real search tool, so write no Possible match section.')+' If a picture is attached, describe only what you can really see. Never call anything fake without reliable evidence.]';
}
};

/* ---------- Save an Investigation Case on this device (browser localStorage only; no cloud, no account) ---------- */
(function(){
var KEY='scamsense-saved-investigations';
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(r)?r:[]}catch(e){return []}}
function store(l){try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch(e){return false}}
function find(id){return load().filter(function(p){return p.id===id})[0]||null}
function pack(c){return{id:c.id,title:c.title,created:c.created,saved:new Date().toISOString(),items:c.items.map(function(x){var o={};for(var k in x){if(k!=='imgUrl')o[k]=x[k]}if(x.imgUrl)o.picGone=true;return o})}}
function unpack(p){return{id:p.id,title:p.title,created:new Date(p.created),items:(p.items||[]).map(function(x){var o=Object.assign({},x);o.ts=new Date(x.ts);if(o.picGone&&o.title==='Picture')o.title='Picture (file not saved)';return o})}}
var NOTE='<div class="rs" style="margin:0 0 10px">Saved only in this browser, on this device. There is no cloud backup and no account. If you clear your browser data, saved cases are lost. Picture files are not kept, only their notes.</div>';
var _case=Views.case;
Views.case=function(){
var h=_case(),c=curCase();if(!c)return h;
var p=find(c.id);
return h+sect('Save this investigation')+NOTE
+(p?'<div class="rs" style="margin:0 0 10px">Last saved '+esc(fmt(new Date(p.saved)))+'. Save again to keep anything you added since.</div>':'')
+prim(p?'Save changes on this device':'Save on this device','ls-save')
+(p?sec('Delete saved copy','ls-del',c.id):'');
};
var _cases=Views.cases;
Views.cases=function(){
var h=_cases(),l=load();
if(!l.length)return h;
return h+sect('Saved on this device')+NOTE+l.map(function(p){
var n=(p.items||[]).length;
return '<div class="card"><div class="rt">Case: '+esc(p.title)+'</div><div class="rs">'+n+' item'+(n===1?'':'s')+' · saved '+esc(fmt(new Date(p.saved)))+'</div>'
+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0"><button class="chip" data-act="ls-open" data-arg="'+esc(p.id)+'">Open and continue</button><button class="chip" data-act="ls-del" data-arg="'+esc(p.id)+'">Delete saved copy</button></div></div>';
}).join('');
};
Flow['ls-save']=function(){
var c=curCase();if(!c)return;
var l=load().filter(function(p){return p.id!==c.id});
l.unshift(pack(c));
S.flash=store(l)?'Saved on this device. You can open it later from Cases.':'Could not save. Your browser may be blocking storage.';
go('case');
};
Flow['ls-open']=function(id){
var p=find(id);if(!p)return;
if(!S.cases.some(function(c){return c.id===id}))S.cases.push(unpack(p));
S.caseId=id;S.flash='Opened your saved case. Add to it and save again whenever you like.';go('case');
};
Flow['ls-del']=function(id){
if(!find(id))return;
if(!window.confirm('Delete the saved copy of this case from this device?'))return;
var ok=store(load().filter(function(p){return p.id!==id}));
S.flash=S.view==='case'?(ok?'Saved copy deleted. This case stays open until you leave the app.':'Could not delete. Your browser may be blocking storage.'):'';
render();
};
})();

render();
</script>

<script>
/* =====================================================================
   ACCOUNT SIGN-IN (Firebase Authentication, Web SDK v10 modular)
   ScamSense never stores passwords. The email and password go straight
   to Firebase and the password box is cleared right after. Firebase keeps
   its own sign-in session; ScamSense saves nothing about it.

   THE FIREBASE WEB CONFIG IS NOW IN ScamSenseAuth.config below (apiKey, authDomain, projectId, appId, ... from Firebase console >
   Project settings > Your apps > Web app). The apiKey in that config is a
   public identifier, not a secret. Until it is filled in, Google and email
   show "Account sign-in is being set up."

   Firebase only signs people in from an authorized web address (HTTPS, or
   localhost). Add the site's domain in Firebase console > Authentication >
   Settings > Authorized domains. Opened as a plain file, sign-in cannot
   work and the person is told so politely. Nothing is ever faked.
   ===================================================================== */
var FirebaseAdapter={
V:'10.12.2',
_p:null,
load:function(cfg){
var self=this;
if(!self._p){
var base='https://www.gstatic.com/firebasejs/'+self.V+'/';
self._p=Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js')]).then(function(m){
var app=m[0].initializeApp(cfg);
return{A:m[1],auth:m[1].getAuth(app)}
}).catch(function(e){self._p=null;throw e})
}
return self._p
},
user:function(u){return u?{uid:u.uid,email:u.email||null,name:u.displayName||null}:null},
signInWithGoogle:function(){
var self=this;
return self.load(ScamSenseAuth.config).then(function(f){
return f.A.signInWithPopup(f.auth,new f.A.GoogleAuthProvider()).then(function(r){return{ok:true,user:self.user(r.user)}})
})
},
signInWithEmail:function(d){
var self=this;
return self.load(ScamSenseAuth.config).then(function(f){
var p=d.create?f.A.createUserWithEmailAndPassword(f.auth,d.email,d.password):f.A.signInWithEmailAndPassword(f.auth,d.email,d.password);
return p.then(function(r){return{ok:true,user:self.user(r.user)}})
})
},
resetPassword:function(d){
return this.load(ScamSenseAuth.config).then(function(f){return f.A.sendPasswordResetEmail(f.auth,d.email).then(function(){return{ok:true}})})
},
signOut:function(){
return this.load(ScamSenseAuth.config).then(function(f){return f.A.signOut(f.auth).then(function(){return{ok:true}})})
},
onChange:function(cb){
var self=this;
return this.load(ScamSenseAuth.config).then(function(f){return f.A.onAuthStateChanged(f.auth,function(u){cb(self.user(u))})})
}
};
var ScamSenseAuth={
config:{ /* Firebase web config for the ScamSense AI project (public identifiers, not secrets) */
apiKey:'AIzaSyC2Ndsgn7gzAtFWNKDMFiM9oA5F7hf-JD0',
authDomain:'scamsense-ai-965ed.firebaseapp.com',
projectId:'scamsense-ai-965ed',
storageBucket:'scamsense-ai-965ed.firebasestorage.app',
messagingSenderId:'611476532481',
appId:'1:611476532481:web:3bba665be01eadc7537f00',
measurementId:'G-RLZQRVST9N'
},
adapter:FirebaseAdapter,
user:null,
isConfigured:function(){var c=this.config;return !!(c&&c.apiKey&&c.projectId&&c.appId&&this.adapter)},
start:function(provider,data){
var self=this;
if(!self.isConfigured())return Promise.resolve({ok:false,reason:'not-configured'});
var fn=provider==='google'?'signInWithGoogle':provider==='email'?'signInWithEmail':provider==='reset'?'resetPassword':null;
if(!fn||typeof self.adapter[fn]!=='function')return Promise.resolve({ok:false,reason:'not-configured'});
return Promise.resolve().then(function(){return self.adapter[fn](data||{})}).then(function(r){
if(r&&r.ok){if(r.user)self.user=r.user;return{ok:true,user:self.user}}
return{ok:false,reason:'failed'}
}).catch(function(e){return{ok:false,reason:'failed',code:String((e&&e.code)||'')}})
},
signOut:function(){
var self=this;
if(!self.isConfigured()||typeof self.adapter.signOut!=='function'){self.user=null;return Promise.resolve({ok:true})}
return Promise.resolve().then(function(){return self.adapter.signOut()}).then(function(){self.user=null;return{ok:true}}).catch(function(){return{ok:false}})
},
/* turns any failure into plain words; technical codes are never shown */
friendly:function(code){
code=String(code||'');
if(/popup-closed|cancelled-popup|popup-blocked/.test(code))return 'Sign-in was cancelled. You can try again, or continue without an account.';
if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(code))return 'That email or password doesn’t look right. Please try again.';
if(/email-already-in-use/.test(code))return 'An account with this email already exists. Try signing in instead.';
if(/weak-password/.test(code))return 'Please choose a password with at least 6 characters.';
if(/invalid-email|missing-email/.test(code))return 'Please check the email address and try again.';
if(/too-many-requests/.test(code))return 'Too many tries. Please wait a little and try again.';
if(/unauthorized-domain|operation-not-supported|operation-not-allowed|web-storage-unsupported|invalid-api-key|invalid-app-credential|app-not-authorized/.test(code))return 'Sign-in isn’t available from here yet. It works on the official ScamSense website. You can continue without an account.';
if(/network/.test(code)||(typeof navigator!=='undefined'&&navigator.onLine===false))return 'We couldn’t reach the sign-in service. Please check your connection, or continue without an account.';
return 'We couldn’t sign you in just now. You can try again, or continue without an account.'
}
};
try{(function(){var w=document.getElementById('ss-welcome'),sp=document.querySelector('#ss-splash img'),lg=document.getElementById('ssw-logo');if(!w)return;if(sp&&lg)lg.src=sp.src;
var NOTSET='Account sign-in is being set up. For now, you can continue without an account.';
function note(t){var n=document.getElementById('ssw-note');if(n)n.textContent=t}
function enter(){w.classList.add('out');setTimeout(function(){if(w.parentNode)w.parentNode.removeChild(w)},320)}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function wipe(){var e=document.getElementById('ssw-pw');if(e)e.value=''}
var busy=false;
function run(provider,data,okMsg){
if(busy)return;busy=true;note('');
ScamSenseAuth.start(provider,data).then(function(r){busy=false;wipe();
if(r&&r.ok){if(okMsg){note(okMsg);return}enter();return}
note(r&&r.reason==='not-configured'?NOTSET:ScamSenseAuth.friendly(r&&r.code))
})}
w.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button[data-w]');if(!b)return;
var k=b.getAttribute('data-w');
if(k==='skip'){enter();return}
if(k==='google'){run('google');return}
if(k==='email'){
if(!ScamSenseAuth.isConfigured()){note(NOTSET);return}
note('');var f=document.getElementById('ssw-email');if(f){f.hidden=false;var i=document.getElementById('ssw-em');if(i)i.focus()}return}
var em=val('ssw-em').trim(),pw=val('ssw-pw');
if(k==='reset'){if(!em){note('Type your email address first, and then tap “Forgot password?”.');return}
run('reset',{email:em},'If an account exists for that email, a password reset message is on its way.');return}
if(k==='signin'||k==='create'){
if(em.indexOf('@')<1){note(ScamSenseAuth.friendly('auth/invalid-email'));return}
if(pw.length<6){note(k==='create'?ScamSenseAuth.friendly('auth/weak-password'):'Please type your password.');return}
run('email',{email:em,password:pw,create:k==='create'})}
})})()}catch(e){}
