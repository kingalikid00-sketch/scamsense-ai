<!DOCTYPE html>

<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('scamsense-theme')==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
html,body{margin:0;background:#020617;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#EAF0FF}
*{box-sizing:border-box}
button{font-family:inherit}
button,input,select{outline:none;-webkit-tap-highlight-color:transparent}
button:focus,button:focus-visible,input:focus,input:focus-visible{outline:none;box-shadow:none}
svg{vertical-align:-0.15em;flex:none}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#040A1C 0%,#071233 100%);font-size:16px;line-height:1.5;position:relative;overflow:hidden}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:12px;min-height:64px;flex:none}
#main{flex:1;overflow-y:auto;padding:0 4% 12px;-webkit-overflow-scrolling:touch}
#dock{flex:none;padding:6px 4% calc(14px + env(safe-area-inset-bottom))}
.ib{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:#EAF0FF;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.ib:hover{background:#13224A}
.pill{width:100%;text-align:left;background:#0E1A3C;border:1px solid #1A2A55;border-radius:32px;padding:8px 14px 8px 8px;display:flex;gap:14px;align-items:center;color:#EAF0FF;cursor:pointer;min-height:clamp(50px,7.4vh,60px);margin:0 0 clamp(6px,1.3vh,10px);font-size:17px;max-width:500px}
.pill:hover{border-color:#2E7BFF;background:#11214A}
.circ{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:none}
.row{width:100%;text-align:left;background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;color:#EAF0FF;cursor:pointer;min-height:64px;margin:0 0 10px;font-size:16px}
.row:hover{border-color:#2E7BFF}
.rt{font-size:16px;font-weight:500;line-height:1.3}
.rs{font-size:14px;color:#8FA0C8;line-height:1.4;margin-top:2px}
.h{font-size:13px;font-weight:600;color:#3DF0D0;margin:12px 0 4px}
.tag{font-size:11px;font-weight:600;border-radius:8px;padding:2px 8px;background:#3A2E12;color:#F5C56B;margin-left:6px;white-space:nowrap}
.chip{border:1px solid #2A3F78;background:transparent;color:#C9D6F5;border-radius:20px;padding:0 14px;height:40px;font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip:hover{border-color:#3DF0D0}
.btn{height:42px;border-radius:12px;border:none;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer}
.inp{flex:1;min-width:0;height:44px;background:transparent;border:none;color:#EAF0FF;font-size:16px;outline:none;padding:0 6px;font-family:inherit}
.inp::placeholder{color:#7F8FC0}
.dots i{width:7px;height:7px;border-radius:50%;background:#7F9BFF;display:inline-block;margin-right:4px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.ul{margin:0 0 8px;padding-left:20px}.ul li{margin:3px 0}
code{background:#16264F;border-radius:6px;padding:1px 6px;font-size:14px}
.rec{background:#EF4444 !important;color:#fff !important;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}
@media (max-height:760px){.mascot{transform:scale(.7)}}
.ai{flex:1;min-width:0;border-radius:4px 18px 18px 18px;padding:12px 14px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.card{background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:14px;margin:0 0 14px}
.demo{border:1px dashed #6B5A22;background:#1C1808;border-radius:12px;padding:8px 12px;font-size:13px;color:#F5C56B}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#3A1226,#1E1440);border:1px solid #6B2440;border-radius:16px;padding:12px 14px;margin:0 0 14px;color:#FFD0D0;font-size:15px;line-height:1.45}
.warnbox svg{color:#FF8A8A;margin-top:2px}
.prim{width:100%;height:54px;border-radius:27px;border:none;background:#14D3B0;color:#04222A;font-size:17px;font-weight:600;cursor:pointer;margin:0 0 12px}
.prim:disabled{opacity:.4;cursor:not-allowed}
.sec{width:100%;height:48px;border-radius:24px;border:1px solid #2A3F78;background:transparent;color:#C9D6F5;font-size:16px;font-weight:500;cursor:pointer;margin:0 0 10px}
.sec:hover{border-color:#3DF0D0}
.fld{width:100%;background:#0B1738;border:1px solid #2A3F78;border-radius:16px;color:#EAF0FF;font-size:16px;font-family:inherit;padding:12px 14px;margin:0 0 12px}
.fld::placeholder{color:#7F8FC0}
textarea{outline:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #1A2A55;font-size:15px}
.kv span:first-child{color:#8FA0C8;flex:none}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:#13224A;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E7BFF,#3DF0D0);transition:width .4s}
.stp{display:flex;align-items:center;gap:12px;padding:8px 0;color:#8FA0C8}
.stp.now{color:#EAF0FF}.stp.done{color:#C9D6F5}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid #2A3F78;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.dot.ok{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #2A3F78;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;margin-top:2px}
.box.on{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.thr{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.th{position:relative;width:96px;height:96px;border-radius:16px;background:#0E1A3C;border:1px solid #1A2A55;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.th img{width:100%;height:100%;object-fit:cover}
.th .ib{position:absolute;top:2px;right:2px;width:30px;height:30px;font-size:16px;background:rgba(2,6,23,.7)}
.th.add{flex-direction:column;gap:4px;color:#8FA0C8;cursor:pointer;border:1px dashed #2A3F78;font-size:13px;font-family:inherit}
.th.add:hover{border-color:#3DF0D0}
.vf{width:200px;height:200px;border-radius:50%;border:2px dashed #3DF0D0;display:flex;align-items:center;justify-content:center;background:#0B1738}

/* ===== HOME SCREEN (ChatGPT-style) ===== */
.hm{min-height:100%;display:flex;flex-direction:column;align-items:center}
.hm-top{flex:1 1 0;min-height:16px}
.hm-intro{flex:none;text-align:center;padding:0 6px 4px;display:flex;flex-direction:column;align-items:center}
.hm-intro .t{font-size:clamp(19px,5.2vw,23px);font-weight:600;line-height:1.3}
.hm-intro .s{font-size:15px;color:#8FA0FF;margin:8px 0 0;max-width:320px;line-height:1.4}
.hm-list{flex:1.7 1 0;min-height:150px;width:100%;max-width:500px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 0 30px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent)}
.hm-list::-webkit-scrollbar{display:none}
.hm-list .pill{flex:none;min-height:54px;margin:0 0 6px;padding-top:6px;padding-bottom:6px}
.hm-list{padding-top:8px}
/* ===== THEME CONTROL (in menu) ===== */
.thm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.thm .seg{display:flex;gap:4px;background:#0B1738;border:1px solid #2A3F78;border-radius:22px;padding:3px}
.thm .seg button{border:none;background:transparent;color:#C9D6F5;border-radius:18px;height:36px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer}
.thm .seg button.on{background:#14D3B0;color:#04222A}

/* ===== LIGHT MODE (applies only when html[data-theme=light]; dark stays the default) ===== */
html[data-theme=light]{color-scheme:light}
html[data-theme=light],html[data-theme=light] body{background:#F4F7FC;color:#0F1A33}

html[data-theme=light] .pill:hover,html[data-theme=light] .row:hover{background:#F1F6FF;border-color:#2E7BFF}

/* ===== TRUSTCHECK labels ===== */
.tcchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.tc-fact{background:#13224A;color:#9DBBFF}
.tc-ai{background:#2A1E5C;color:#C9B8FF}
.tc-unk{background:#232B45;color:#C9D6F5}
.tc-match{background:#3A2E12;color:#F5C56B}
html[data-theme=light] .tc-fact{background:#DCE8FF;color:#2A55C8}
html[data-theme=light] .tc-ai{background:#EADFFF;color:#5B3FC0}
html[data-theme=light] .tc-unk{background:#E6EAF3;color:#3A4A70}

.ec{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.ec-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 2px}
.ec-s{font-size:13px;color:#8FA0C8;line-height:1.4;margin:0 0 8px}
.ec-c{border-top:1px dashed #1A2A55;padding:8px 0}
.ec-c:first-of-type{border-top:0}
.ec-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8FA0C8;margin:0}
.ec-v{font-size:14px;line-height:1.4;color:#EAF0FF;margin:1px 0 0}
.ec-a{font-size:14px;color:#5A6A99;margin:1px 0 1px 4px;line-height:1}
.ec-st{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:2px 9px;margin-top:2px}
.ec-verified{background:#0B3A36;color:#3DF0D0}
.ec-partial{background:#3A2E12;color:#F5C56B}
.ec-unverified{background:#232B45;color:#C9D6F5}
.ec-conflict{background:#4A1D24;color:#FF8A8A}
.ec-unknown{background:#232B45;color:#9DBBFF}
html[data-theme=light] .ec{background:#F3F6FD;border-color:#CFD9F0}
html[data-theme=light] .ec-t,html[data-theme=light] .ec-v{color:#0F1E45}
html[data-theme=light] .ec-s,html[data-theme=light] .ec-k{color:#4A5B85}
html[data-theme=light] .ec-c{border-top-color:#D5DEF2}

html[data-theme=light] .ec-partial{background:#FFF1CC;color:#8A6100}

html[data-theme=light] .ec-conflict{background:#FFE0E0;color:#A12A2A}
.pmap{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.pmap-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 2px}
.pmap-s{font-size:13px;color:#8FA0C8;line-height:1.4;margin:0 0 8px}
.pm-step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative}
.pm-step+.pm-step{border-top:1px dashed #1A2A55}
.pm-dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.pm-said .pm-dot{background:#F5C56B;color:#231A04}
.pm-miss .pm-dot{background:transparent;border:2px dashed #5A6A99;color:#9DBBFF}
.pm-here .pm-dot{background:#3DF0D0;color:#04222A}
.pm-l{font-size:15px;line-height:1.35;font-weight:600}
.pm-miss .pm-l{font-weight:500;color:#C9D6F5}
.pm-n{font-size:13.5px;line-height:1.4;color:#B7C5E8;margin-top:2px}
.pm-st{font-size:12.5px;line-height:1.35;color:#8FA0C8;margin-top:2px}
.pm-you{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:1px;background:#0B3A36;color:#3DF0D0;white-space:nowrap}
.pmap-key{font-size:12.5px;line-height:1.45;color:#8FA0C8;margin:8px 0 0}

/* ===== PRESSURE METER ===== */
.pmeter{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}
.pmeter-t{font-size:15px;font-weight:700;color:#EAF0FF;margin:0 0 6px}

.pmeter-d{font-size:14.5px;line-height:1.45;color:#C9D6F5;margin:0 0 6px}

.pmeter-tip{font-size:13.5px;line-height:1.45;color:#C9D6F5;margin:8px 0 0}
.pmeter-care{font-size:13.5px;line-height:1.45;color:#C9D6F5;margin:8px 0 0;padding-top:8px;border-top:1px solid #1A2A55}
html[data-theme=light] .pmeter{background:#F3F6FD;border-color:#CFD9F0}
html[data-theme=light] .pmeter-t,html[data-theme=light] .pmeter-sl{color:#0F1E45}
html[data-theme=light] .pmeter-bar i{background:#D5DEF2}
html[data-theme=light] .pmeter-d,html[data-theme=light] .pmeter-tip,html[data-theme=light] .pmeter-care{color:#1F2F57}
html[data-theme=light] .pmeter-h{color:#4A5B85}
html[data-theme=light] .pmeter-sn{color:#33436B}
html[data-theme=light] .pmeter-s{border-top-color:#D5DEF2}
html[data-theme=light] .pmeter-care{border-top-color:#D5DEF2}

/* ===== PROOFCHECK (part 5) ===== */
.pf-r{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;line-height:1.45;font-size:15px}
.pf-r>div{flex:1;min-width:0;overflow-wrap:anywhere}
.pf-t{flex:none;width:104px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:8px;padding:3px 4px;margin-top:2px}
.pf-FACT{background:#102A5C;color:#9DBBFF}
.pf-AI{background:#0B3A36;color:#3DF0D0}
.pf-MATCH{background:#3A2E12;color:#F5C56B}
.pf-UNK{background:#2A2F45;color:#B4C3E8}
.pf-leg{margin:0 0 6px;font-size:14px;color:#8FA0C8}
.pf-leg summary{cursor:pointer;padding:4px 0}
.pf-lg{padding-top:6px}
html[data-theme=light] .pf-FACT{background:#DCE8FF;color:#1F4FBF}
html[data-theme=light] .pf-AI{background:#D3F5EE;color:#0B6E5E}
html[data-theme=light] .pf-MATCH{background:#FFF1CC;color:#8A6100}
html[data-theme=light] .pf-UNK{background:#E6EAF3;color:#3A4A70}
html[data-theme=light] .pf-leg{color:#5B6B8F}
/* ===== STARTUP SCREEN (shows briefly, then removes itself) ===== */
#ss-splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 38%,#0B1A44 0%,#050B1F 60%,#03060F 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:ssOut .4s ease 1.5s forwards}
#ss-splash img{display:block;width:clamp(140px,34vh,200px);height:auto;animation:ssIn .6s ease both,ssPulse 2s ease-in-out .6s infinite}
#ss-splash .n{font-size:clamp(24px,6.4vw,30px);font-weight:600;color:#EAF0FF;margin:18px 0 0;letter-spacing:.01em;animation:ssIn .6s ease .15s both}
#ss-splash .t{font-size:clamp(15px,4.2vw,17px);color:#8FA0FF;margin:6px 0 0;animation:ssIn .6s ease .3s both}
#ss-splash .bar{width:120px;height:3px;border-radius:3px;background:#12214D;margin:26px 0 0;overflow:hidden;animation:ssIn .6s ease .4s both}
#ss-splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#3DF0D0,#2E7BFF);animation:ssBar 1.1s ease-in-out infinite}
@keyframes ssIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ssPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes ssBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes ssOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#ss-splash img,#ss-splash .bar i{animation:none}#ss-splash .n,#ss-splash .t,#ss-splash .bar{animation:none}}
/* ===== WELCOME SCREEN (shown after the startup screen; account buttons are placeholders) ===== */
#ss-welcome{position:fixed;inset:0;z-index:99998;background:radial-gradient(circle at 50% 30%,#0B1A44 0%,#050B1F 60%,#03060F 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 22px;overflow-y:auto;color:#EAF0FF;transition:opacity .3s ease}
#ss-welcome.out{opacity:0;pointer-events:none}
#ss-welcome .w{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;margin:auto 0}
#ss-welcome img{display:block;width:clamp(96px,20vh,140px);height:auto;margin:0 0 16px}
#ss-welcome h1{font-size:clamp(26px,7vw,32px);line-height:1.2;font-weight:700;margin:0 0 10px;color:#EAF0FF}
#ss-welcome p.s{font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:#B8C4E6;margin:0 0 24px}
#ss-welcome button{width:100%;min-height:58px;border-radius:30px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;margin:0 0 12px;padding:12px 20px;color:#EAF0FF;background:#0E1A3C;border:1px solid #2A3C75}
#ss-welcome button:active{filter:brightness(1.15)}
#ss-welcome button.go{background:linear-gradient(135deg,#2563EB,#1D4ED8);border-color:#2563EB;color:#fff;margin-bottom:0}
#ss-welcome button:focus-visible{outline:3px solid #9DBBFF;outline-offset:2px}
#ss-welcome .note{min-height:44px;font-size:16px;line-height:1.4;color:#F5C56B;margin:0 0 12px;padding:0 4px}
#ss-welcome input{width:100%;min-height:54px;border-radius:16px;font:inherit;font-size:18px;color:#EAF0FF;background:#0A1430;border:1px solid #2A3C75;padding:10px 16px;margin:0 0 10px;box-sizing:border-box}
#ss-welcome input::placeholder{color:#7C8BB8}
#ss-welcome input:focus-visible{outline:3px solid #9DBBFF;outline-offset:2px}
#ss-welcome [hidden]{display:none!important}
.thinking{display:inline-flex;align-items:center;gap:6px}
.thinking .dots{display:inline-flex;align-items:center}
.think{font-size:15px;color:#8FA0C8;animation:ssThink 1.6s ease-in-out infinite}
@keyframes ssThink{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.think{animation:none}}
html[data-theme=light] .think{color:#4A5B85}
</style>
</head>
