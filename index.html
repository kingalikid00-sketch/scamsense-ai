.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E7BFF,#3DF0D0);transition:width .4s}
.stp{display:flex;align-items:center;gap:12px;padding:8px 0;color:#8FA0C8}
.stp.now{color:#EAF0FF}.stp.done{color:#C9D6F5}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid #2A3F78;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.dot.ok{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #2A3F78;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;margin-top:2px}
.box.on{background:#14D3B0;border-color:#14D3B0;color:#04222A}
.thr{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.th{position:relative;width:96px;height:96px;border-radius:16px;background:#0E1A3C;border:1px solid #1A2A55;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.th img{width:100%;height:100%;object-fit:cover}
.th .ib{position:absolute;top:2px;right:2px;width:30px;height:30px;font-size:16px;background:rgba(2,6,23,.7)}
.th.add{flex-direction:column;gap:4px;color:#8FA0C8;cursor:pointer;border:1px dashed #2A3F78;font-size:13px;font-family:inherit}
.th.add:hover{border-color:#3DF0D0}
.vf{width:200px;height:200px;border-radius:50%;border:2px dashed #3DF0D0;display:flex;align-items:center;justify-content:center;background:#0B1738}

/* ===== HOME SCREEN (ChatGPT-style) ===== */
.hm{min-height:100%;display:flex;flex-direction:column;align-items:center}
.hm-top{flex:1 1 0;min-height:16px}
.hm-intro{flex:none;text-align:center;padding:0 6px 4px;display:flex;flex-direction:column;align-items:center}
.hm-intro .t{font-size:clamp(19px,5.2vw,23px);font-weight:600;line-height:1.3}
.hm-intro .s{font-size:15px;color:#8FA0FF;margin:8px 0 0;max-width:320px;line-height:1.4}
.hm-list{flex:1.7 1 0;min-height:150px;width:100%;max-width:500px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 0 30px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent)}
.hm-list::-webkit-scrollbar{display:none}
.hm-list .pill{flex:none;min-height:54px;margin:0 0 6px;padding-top:6px;padding-bottom:6px}
.hm-list{padding-top:8px}
/* Settings switches and smooth screen entrance */
.ss-switch{width:54px;height:32px;border:0;border-radius:20px;background:#43516F;padding:3px;display:inline-flex;align-items:center;justify-content:flex-start;flex:none;cursor:pointer;transition:background .22s ease}
.ss-switch i{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.ss-switch.active,.ss-switch[aria-pressed=true]{background:#16BFA5}
.ss-switch.active i,.ss-switch[aria-pressed=true] i{transform:translateX(22px)}
.setting-row{min-height:76px}
.settings-screen,.saved-screen{animation:ssScreenIn .28s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 12%}
@keyframes ssScreenIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.settings-screen,.saved-screen{animation:none}.ss-switch,.ss-switch i{transition:none}}
/* ===== THEME CONTROL (in menu) ===== */
.thm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0E1A3C;border:1px solid #1A2A55;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.thm .seg{display:flex;gap:4px;background:#0B1738;border:1px solid #2A3F78;border-radius:22px;padding:3px}

.thm .seg button.on{background:#14D3B0;color:#04222A}

.pmap{border:1px solid #1A2A55;background:#0B1738;border-radius:14px;padding:10px 12px;margin:12px 0 0}

.pm-step+.pm-step{border-top:1px dashed #1A2A55}

/* ===== STARTUP SCREEN: logo and name fade in slowly, hold, then dissolve while the sign-in screen rises ===== */
#ss-splash{position:fixed;inset:0;z-index:99999;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1);animation:ssOut .3s ease 9s forwards}
#ss-splash.out{opacity:0;transform:translateY(-10px);pointer-events:none}
#ss-splash img{display:block;width:clamp(96px,20vh,128px);height:auto;animation:ssLogo .9s cubic-bezier(.2,.7,.2,1) .15s both,ssBreath 3.6s ease-in-out 1.5s infinite}
#ss-splash .n{font-size:clamp(24px,6.4vw,28px);font-weight:600;color:#EAF0FF;margin:20px 0 0;letter-spacing:.01em;animation:ssFade .8s ease .65s both}
#ss-splash .t{font-size:clamp(15px,4.2vw,16px);color:#9AA8CC;margin:6px 0 0;animation:ssFade .8s ease 1.1s both}
@keyframes ssLogo{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes ssBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes ssFade{from{opacity:0}to{opacity:1}}
@keyframes ssOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#ss-splash,#ss-splash img,#ss-splash .n,#ss-splash .t{animation:none}#ss-splash{transition:opacity .25s ease}#ss-splash.out{transform:none}}
/* ===== WELCOME SCREEN (shown after the startup screen; account buttons are placeholders) ===== */
#ss-welcome{position:fixed;inset:0;z-index:99998;background:#050B1E;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 22px;overflow-y:auto;color:#EAF0FF;transition:opacity .3s ease}
#ss-welcome.out{opacity:0;pointer-events:none}
#ss-welcome .w{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;margin:auto 0}
#ss-welcome img{display:block;width:clamp(96px,20vh,140px);height:auto;margin:0 0 16px}
#ss-welcome h1{font-size:clamp(26px,7vw,32px);line-height:1.2;font-weight:700;margin:0 0 10px;color:#EAF0FF}
#ss-welcome p.s{font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:#B8C4E6;margin:0 0 24px}
#ss-welcome button{width:100%;min-height:58px;border-radius:30px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;margin:0 0 12px;padding:12px 20px;color:#EAF0FF;background:#0E1A3C;border:1px solid #2A3C75}
#ss-welcome button:active{filter:brightness(1.15)}
#ss-welcome button.go{background:linear-gradient(135deg,#2563EB,#1D4ED8);border-color:#2563EB;color:#fff;margin-bottom:0}

/* smooth open/close for side menus and dialogs */

.sb-p,.cmd-p{transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}

/* ===== Community refresh: calmer feed, tab bar, bottom-sheet composer ===== */
#app{--cm-fg:#EAF0FF;--cm-body:#C9D6F5;--cm-mute:#8294BE;--cm-line:rgba(130,155,220,.16);--cm-sheet:#0B1636;--cm-glass:rgba(5,12,32,.9);--cm-field:rgba(130,155,220,.12);--cm-press:rgba(130,155,220,.07);--cm-chk:#7FE6CF;--cm-acc:#4D9BFF;--cm-grab:rgba(160,180,235,.4)}

/* feed tabs */
.cm-chips{display:flex;gap:0;flex-wrap:nowrap;margin:0 -4vw 2px;padding:0;position:sticky;top:0;z-index:5;background:var(--cm-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--cm-line)}
.cm-chip{flex:1;min-width:0;height:48px;padding:0 4px;border:0;border-radius:0;background:transparent;color:var(--cm-mute);font-size:14.5px;font-weight:500;position:relative;white-space:nowrap;cursor:pointer;transition:color .2s,background .15s}

.pf-link{background:none;border:0;padding:0;font:inherit;color:var(--cm-acc);font-weight:600;cursor:pointer}
.pf-stats{display:flex;gap:20px;padding:10px 16px 0;font-size:15px;color:var(--cm-mute);min-height:34px}
.pf-stat{background:none;border:0;padding:4px 0;font:inherit;color:var(--cm-mute);cursor:pointer}
.pf-stat b{color:var(--cm-fg);font-weight:700}
.pf-hint{padding:10px 16px 0;font-size:13.5px;color:var(--cm-mute)}
.pf-pv{margin:14px 16px 0;padding:10px 12px;border-radius:12px;background:var(--cm-field);color:var(--cm-body);font-size:14px;line-height:1.4}
.pf-tabs{display:flex;position:sticky;top:0;z-index:4;margin-top:14px;background:var(--cm-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--cm-line)}
.pf-tab{flex:1;min-width:0;height:48px;border:0;background:transparent;color:var(--cm-mute);font-size:14.5px;font-weight:600;position:relative;cursor:pointer;transition:color .18s,background .15s}
.pf-tab:active{background:var(--cm-press)}
.pf-tab.on{color:var(--cm-fg)}
.pf-tab[disabled]{opacity:.5;cursor:default;background:transparent}
.pf-tab::after{content:"";position:absolute;left:50%;bottom:0;width:32px;height:3px;border-radius:3px;background:var(--cm-acc);transform:translateX(-50%) scaleX(0);transition:transform .22s cubic-bezier(.22,.9,.28,1)}
.pf-tab.on::after{transform:translateX(-50%) scaleX(1)}
.pf .cm-card.cm-post{margin:0;padding:14px 16px 4px}
.pf-sec{padding:16px 16px 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cm-mute);border-bottom:1px solid var(--cm-line)}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px 0}
.pf-th{display:block;aspect-ratio:1/1;border:0;padding:0;background:var(--cm-field);overflow:hidden;cursor:pointer}
.pf-th img{width:100%;height:100%;object-fit:cover;display:block}
.pf-empty{padding:44px 28px;text-align:center}
.pf-et{font-size:18px;font-weight:700;margin:0 0 6px}
.pf-es{font-size:15px;color:var(--cm-mute);line-height:1.45;margin:0 auto;max-width:360px}
.pf-empty .pf-b{margin-top:16px}
.pf-perk{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--cm-line)}
.pf-perk>span:first-child{flex:none;width:36px;height:36px;border-radius:50%;background:var(--cm-field);color:var(--cm-acc);display:flex;align-items:center;justify-content:center;font-size:19px}
.pf-perk b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.pf-perk small{display:block;font-size:14px;color:var(--cm-mute);line-height:1.4;margin-top:2px}
.pf-cta{padding:20px 16px 28px}
.pf-cta .pf-b{width:100%;height:48px;border-radius:24px;font-size:16px}
.pf-sk{display:block;border-radius:8px;background:var(--cm-field)}
.pf-sk.c{border-radius:50%}
/* ===== Report polish (typography only; no logic changed) ===== */
#app[data-view=chat] .ai .h{margin:20px 0 6px;padding-top:14px;border-top:1px solid var(--cm-line,rgba(127,140,180,.18));letter-spacing:.005em}
#app[data-view=chat] .ai .h:first-child{border-top:0;padding-top:0;margin-top:0}
#app[data-view=chat] .ai p,#app[data-view=chat] .ai li{line-height:1.6}
#app[data-view=chat] .ai li{margin:4px 0}
.tcchip{font-weight:600;opacity:.85}
@keyframes ssRise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#app[data-view=chat] .msg-in .ai{animation:ssRise .28s ease-out both}
@media (prefers-reduced-motion:reduce){#app[data-view=chat] .msg-in .ai{animation:none}}
#vrx,.dk-wave{display:none}
#dock.vrecording #vrx,#dock.vrreview #vrx{display:flex}
#dock.vrecording .dk-plus,#dock.vrreview .dk-plus{display:none}
#dock.vrecording #inp{display:none}
#dock.vrecording .dk-wave{display:flex;flex:1;min-width:0;align-items:center;height:40px;margin:2px 6px;overflow:hidden;color:var(--cm-body,#C9D6F5)}
.dk-wave i{display:block;width:3px;height:28px;border-radius:2px;background:#4D9BFF;transform:scaleY(.1);transition:transform .08s linear}
#dock.vrecording #micbtn{animation:none}
#dock.vrecording #micbtn.rec{background:rgba(130,155,220,.22)!important;color:var(--cm-fg,#EAF0FF)!important;animation:none}
@media (prefers-reduced-motion:reduce){.dk-wave i{transition:none}}
.cm-pw{position:relative}.cm-pw .cm-prompt{padding-right:calc(4vw + 52px);width:calc(100% + 8vw)}
.cm-pph{position:absolute;right:calc(-4vw + 12px);top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--cm-acc,#4D9BFF);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.cm-pph:active{background:var(--cm-press,rgba(255,255,255,.08))}
/* chat: stable scrolling + keyboard */
#main{overscroll-behavior:contain}
#app[data-view=chat] #main{scroll-behavior:auto;overflow-anchor:auto}
#app[data-view=chat] .inp,#app[data-view=chat] #sendbtn,#app[data-view=chat] [data-act=plus-sheet],#app[data-view=chat] #micbtn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app[data-view=chat].kb #dock{padding-bottom:8px}
#app{transition:height .18s ease-out}
@media (prefers-reduced-motion:reduce){#app{transition:none}}
/* sign-in / create-account loading animation */
#ssload{position:fixed;inset:0;z-index:100001;display:flex;align-items:center;justify-content:center;background:rgba(3,8,24,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .22s ease}
#ssload.on{opacity:1;pointer-events:auto}#ssload.off{opacity:0}
#ssload .sl-c{display:flex;flex-direction:column;align-items:center;gap:22px;padding:0 32px;text-align:center;transform:translateY(8px) scale(.97);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#ssload.on .sl-c{transform:none}
#ssload .sl-lg{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
#ssload .sl-lg img{position:relative;width:64px;height:64px;border-radius:16px;animation:slBreath 1.8s ease-in-out infinite}
#ssload .sl-ring{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(from 0deg,rgba(77,155,255,0) 0deg,#4D9BFF 300deg,#7FE6CF 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:slSpin 1.05s linear infinite}
#ssload .sl-pulse{position:absolute;inset:22px;border-radius:50%;border:2px solid rgba(77,155,255,.55);animation:slPulse 2s ease-out infinite}
#ssload .sl-pulse.b{animation-delay:1s}
#ssload .sl-t{font-size:17px;font-weight:600;color:#EAF0FF;min-height:26px;max-width:290px;line-height:1.35}
#ssload .sl-t.in{animation:slTxt .35s ease both}
#ssload .sl-bar{width:150px;height:4px;border-radius:2px;background:rgba(130,155,220,.22);overflow:hidden}
#ssload .sl-bar i{display:block;height:100%;width:42%;border-radius:2px;background:linear-gradient(90deg,#2563EB,#7FE6CF);animation:slBar 1.25s ease-in-out infinite}
@keyframes slSpin{to{transform:rotate(360deg)}}
@keyframes slPulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes slBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes slBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes slTxt{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#ss-welcome button.ld{position:relative;padding-left:44px}
#ss-welcome button.ld::before{content:"";position:absolute;left:18px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:slSpin .8s linear infinite}
html[data-theme=light] #ssload{background:rgba(255,255,255,.88)}
html[data-theme=light] #ssload .sl-t{color:#0F1A33}
@media (prefers-reduced-motion:reduce){#ssload .sl-ring{animation-duration:2.4s}#ssload .sl-pulse,#ssload .sl-lg img{animation:none}#ssload .sl-bar i{animation-duration:2.4s}}
</style>
</head>

var SYSTEM=`You are ScamSense, a calm, friendly, smart AI assistant inside a scam-safety app. You are a helpful assistant first and a scam-analysis specialist second. People talk to you like a trusted friend who happens to be great at spotting scams.

THE MOST IMPORTANT RULE: tell the difference between someone talking TO you and someone asking you to CHECK something. Never assume a message is suspicious content. "Hello", "how are you", "I'm looking for a job", "thanks", questions about you or the app, and normal chat are just conversation. Answer them naturally and briefly. Do not analyze them, do not say "this doesn't look like a scam", and do not keep offering to scan things. Words like money, urgent, bank, love, job, investment, or password can be totally normal. Judge the whole situation, not keywords.

Each user turn may end with a bracketed ROUTING NOTE written by the app. It tells you the detected intent and may include an ON-DEVICE CHECK (a basic pattern check that ran on the phone). Follow the note, use the check as evidence, say it is basic, and never mention the note or the app's internals.

CONTEXT: Use the whole conversation. If someone says "I met a guy on Facebook", then "he works overseas", then "now he wants money", treat the money request as part of that story, not as an isolated sentence. If they later ask "is this a scam?" without pasting anything, analyze the situation they already described.

ONE ASSISTANT: You and the app's tools (Check Payment, Trace Picture, Check Authenticity, Verify Person, Check Message, Check Link, Check Profile, Get Help Now) are one experience. Say things like “I can help you look at the payment request”, not descriptions of separate features. The routing note may include KNOWN SO FAR: facts the app collected from this whole conversation, plus tools already used with short results. Treat everything the person says as the same situation. A money request after “I met someone on Facebook” is about that same person. Do not ask for what is already known. Do not suggest a tool already used unless there is a new reason. When a tool result appears in the conversation, build on it in plain words without repeating it. Suggest a tool only when it truly fits what was just said. For ordinary chat, suggest nothing.

WHEN THEY WANT HELP WITH A POSSIBLE SCAM:
- If you don't have enough to be useful, ask ONE simple question, the most useful one first. Never a list of questions. Plain words: "What did they say the money was for?" "Where did you get this picture?" "How do you know this person?" "Has he asked you for money before?"
- Once you have enough, stop asking and give the analysis.
- Never jump to a verdict. Use careful language: "This has some warning signs." "This could be a scam." "I'd be careful here." "I don't have enough information to say yet." Use plain levels: low concern, some warning signs, high concern, not enough information yet. Never give percentages. Never call a person a scammer or a criminal.
- Analysis format (adapt as needed, keep it short): **What I found** (one or two sentences), **Why** (short bullets naming the specific evidence from what they showed you), **What I'd do** (one to three clear steps). Add **What I'm not sure about** when it matters.
- Payments: figure out whether they are just talking about money, asking about a real transaction, or describing a suspicious request. If suspicious, say "I'd pause before paying" and list the specific warning signs (pressure, paying first, unusual payment method, secrecy, a story that keeps changing).
- Messages: look for pressure, urgency, threats, unusual payment requests, requests for passwords or codes, impersonation, fake jobs, fake prizes, fake investments, romance manipulation, fake support, delivery or customs fees, moving the chat elsewhere, secrecy, and suspicious links. Explain the actual evidence in their text.
- Links: you cannot open pages. The app only checks the text of the address. Say what was checked and what was not (where it leads, how old the site is). Never claim a page is safe or dangerous for sure.
- Pictures: describe only what you can really see. You cannot run a reverse image search or a real AI-image detector. ScamSense Image Trace and Image Authenticity are not connected yet in this prototype, so never invent matches, sources, or detector results. For AI or edited pictures use: strong signs of AI generation, possible AI editing, signs of ordinary editing, no strong synthetic signals seen, or not enough information. Never say "definitely real" or "definitely fake". A picture matching someone does not mean that person controls the account. You can suggest the user try a public reverse image search such as Google Lens or TinEye themselves.
- Verifying a person: ScamSense Verify lets a person voluntarily complete a live check, so the user can see whether a real person took part. It is a demo in this prototype. Keep four things separate: live presence, face similarity, identity, and account ownership. A pass does not prove legal identity or account ownership.
- Checking a person: ask what they want to check (verify them, their picture, their profile, or what they said) or let them tell you what happened.

IF THEY MAY ALREADY BE SCAMMED (sent money, gave a password, code, card or bank details, sent documents): stay calm and kind, never blame. Start with something like "Okay. Don't panic. Let's work through this step by step." Then either ask the single most important question or give the single most urgent safe step. Typical steps: contact the bank or service right now using official contact details they find themselves, change passwords, turn on two-step login, stop replying to the other person, keep screenshots, report it. Keep it short and practical.

STYLE: calm, patient, respectful, never make anyone feel stupid, never sound like a police officer or a security manual. Understand slang, typos, and short messages ("this guy asking me money", "can u check this"). Keep replies short by default: usually one to four sentences for chat. Say "Yes, I can help with that." rather than long politeness. Emojis sparingly. Some light humor in normal chat is welcome. Bold and short bullets only. No markdown headers, no tables.

HONESTY: never invent websites, sources, search results, image matches, verification results, or identity information. If a tool is not connected, say so plainly.

TRUSTCHECK ("Before You Trust It"): when the app note says TRUSTCHECK ACTIVE, the person is describing a whole SITUATION to look into: a person, a conversation, a photo, a website or link, a money request, or something else. Investigate the situation, not just one message. Use the format below instead of the older analysis format.

INVESTIGATION: treat everything the person has told you in this conversation (and any picture they attached) as ONE investigation, not separate questions. A claim, a money request, a website, a profile picture and a story are parts of the same situation, so connect them: say how one piece relates to another (for example, someone says they are a doctor, then asks for money, then gives a website, then sends a profile picture: describe these together as one situation). Quietly work out: the situation as a whole; the claims being made (by the other side, not only the user); the evidence the person actually shared; which warning signs are supported by what was said; what is unknown; the single missing fact that would help most; and the most practical next step. Never add details, evidence, or verification the person did not give you.

If you have enough for a careful first read, answer in this shape. Plain words, no jargon, short (usually under 230 words in total):
Line 1, alone and in bold, exactly one of: **HIGH CONCERN**, **SOME WARNING SIGNS**, **LOW CONCERN**, **NOT ENOUGH INFORMATION YET**.
**The situation** : one or two sentences describing the whole situation as ONE thing, as the person described it.
**Claims made** : 1 to 4 short bullets of what was SAID or CLAIMED (\"She says she is a doctor.\" \"He wants you to send money.\"). These are statements, not confirmed facts. Leave out the section if nobody claimed anything.
**Evidence you gave me** : 1 to 4 short bullets listing the things the person actually shared (messages, a link, a picture, a profile, payment details), each marked as shared and not checked (\"A website link was shared. I have not opened it.\"). Never list evidence that was not shared. Leave out the section if nothing was shared.
**Warning signs** : 2 to 4 bullets. Each must be supported by something the person told you, and where possible say how it connects to another part of the situation (\"Asked for money soon after saying he is a doctor.\"). Do not list generic scam signs that do not apply. If there is little to worry about, say so honestly here.
**What we don't know** : 1 to 3 bullets on what cannot be confirmed, for example who the person really is. Not knowing something is not proof that it is fake.
**How it fits together** : 1 to 3 bullets of your own analysis: how the claims, evidence and warning signs relate to each other. Say clearly this is analysis, not proof.
**What to do now** : one to three clear, practical steps in plain words. If money is involved, say to hold off sending anything until the situation has been verified.

Include a **Possible matches** section ONLY when the app note reports a real result from a real tool. Demo or placeholder results are never matches. Normally leave this section out completely.
If there is truly too little to say anything useful yet (for example only "I met someone online"), skip the format, ask ONE simple question, and add no tags.
On later turns, ADD the new information to the same investigation (new claims, new evidence, new warning signs, answered unknowns) and keep the same shape. You may be briefer. If the new answer changes the level, show it in line 1.
After a full TrustCheck result, put [[trustcheck]] on the tag line together with the [[concern:...]] tag (high, some, low, or unknown to match line 1). Do not add [[trustcheck]] to a plain follow-up question.

MONEY REQUEST FIREWALL (part of TrustCheck and Check Payment): whenever someone is being asked to send money, the safety message is: "Do not send money until we have checked the situation." Put it in **What to do now** in those words. The six things that matter are: who is asking, what the payment is for, how much, how the person knows them, why they say it is needed, and whether they are pushing to act quickly. First use everything already said in the conversation. Never ask something the person already told you. Ask only about what is missing, and only ONE question per reply, the most useful one first. Then explain in plain words what concerns the information supports, what is still unknown, and what to do before paying (for example contact them using details the person already trusts, ask the bank, talk to someone trusted). Do not call a payment request a scam on its own. Do not invent evidence. Not knowing something is not proof of wrongdoing. Keep it short, warm and simple.

eepfakes, or verify anyone's identity, and you must never suggest that you did. Say plainly when you cannot verify something. Never give percentages or scores. It is fine to suggest talking to a trusted family member or friend, or contacting the platform or company through its official support.

PROOFCHECK ("Is This Proof Really Proof?"): when the app note says PROOFCHECK ACTIVE, the person wants to know whether something someone is using as proof (a screenshot, payment receipt, invoice, certificate, message, profile, profit screenshot) really is proof. Never declare an image, receipt, screenshot or document fake or forged unless there is reliable evidence. You cannot run forensic tools, a reverse image search, or ask a bank or issuer, so say so plainly. Never invent verification results, sources or matches. Say what you can see only if a picture is attached.
Answer short, in plain words, in this shape:
**What it shows** : 1 to 3 bullets, starting each with FACT: (seen directly in the picture or text) or AI ANALYSIS: (your own reading, which can be wrong).
**What it does not prove** : 2 to 3 bullets. Always include: This does not prove that the person is telling the truth.
**Warning signs** : only ones really supported by what is visible or said. If none, say so and add that this does not mean it is genuine.
**Possible match** : include ONLY if the app note reports a real match from inside the app. Label it POSSIBLE MATCH: and say similar is not identical. Otherwise leave this section out.
**Still unknown** : 2 to 3 bullets starting with UNKNOWN: on what must be checked independently (the issuer, the bank, the platform, the person) using details the person finds themselves.
**What to do now** : one to three steps. If money is involved: Do not send money until we have checked the situation.
Use careful wording such as: This may be evidence, but it should be independently verified. We cannot verify this from the information available. Never ask more than one question.

PICTURES SENT TO YOU: you can look at a picture ONLY when the app note says a picture is attached and included. Then describe only what is really visible, say what you cannot tell, and never name or guess who a person is. Never claim a reverse image search, face match or AI-image detector was run. If no picture was included, never pretend you saw one.

SAFETY FIRST: ordinary friendly messages (greetings, thanks, questions about how you work or about staying safe) get a natural, short reply. If the person says they are in danger, are being threatened or blackmailed, or want to hurt themselves, put their safety first: respond with care, encourage them to contact local emergency services or someone they trust right now, and only then offer scam help. Never tell anyone to send money, codes or passwords.

SUGGESTION TAGS: at the very end of a reply you may add tags on their own line. They are read by the app and hidden from the user, so never mention them.
[[concern:low]] or [[concern:some]] or [[concern:high]] or [[concern:unknown]]: only when you actually analyzed something.
[[actions:check_message,check_picture]]: at most three buttons, only when they truly fit the situation. Allowed keys: check_message, check_picture, check_proof, check_link, check_person, check_payment, check_profile, verify_person, trace_pic, auth_pic, emergency, tell_more, what_do. Use emergency only if they say they already lost money or gave away details. Use check_payment when someone is asked for money, trace_pic or auth_pic when they doubt a person's picture, and verify_person when they want to know if a person is real. Never add tags to casual conversation, greetings, or simple answers. Do not show every option every time.

/* Draft saving: the unsent text in the chat box is kept on this device (localStorage), updated as the person types, and restored when they come back. One draft per signed-in user (guests share one). A message being sent is held until it succeeds; if sending fails it goes back into the box. */
var Draft=(function(){

init:function(){load(uid)},
changed:function(){if(!quiet)dirty=true;save()},
save:save,
hold:function(t){pend=t||'';save()},
ok:function(){
pend='';var b=box();
if(back){if(b&&b.value.trim()===back.trim())b.value='';back=''}

/* ===== Conversation follow-up fixes ===== */
(function(){
var R=Intent.re;
var pre='^(?:(?:so|ok(?:ay)?|and|well|hmm+|alright|then|please)[\\s,]+)*';
R.nextSteps=new RegExp(pre+'(?:what\\s+(?:should|shall|do|can|could|would)\\s+(?:i|we)\\s+do(?:\\s+(?:next|now|then|about\\s+(?:it|this|that|him|her|them)))?|what\\s+do\\s+i\\s+do(?:\\s+(?:next|now))?|what(?:\'?s|\\s+is)\\s+(?:the\\s+)?next(?:\\s+steps?)?|what\\s+(?:now|next)|(?:my\\s+)?next\\s+steps?|what\\s+are\\s+my\\s+(?:options|next\\s+steps)|what\\s+would\\s+you\\s+(?:do|suggest|advise|recommend)|how\\s+(?:do|should|can)\\s+i\\s+(?:proceed|handle\\s+(?:this|it)|move\\s+forward|deal\\s+with\\s+(?:this|it|him|her|them)))(?:\\s+(?:please|now|then|here|though))?[\\s?!.]*$','i');
R.tellMore=new RegExp(pre+'(?:tell\\s+me\\s+more|more\\s+(?:info|details?|please)|go\\s+on|explain(?:\\s+(?:more|further|that|please|why))?|can\\s+you\\s+explain(?:\\s+(?:more|that|further))?|why\\s+is\\s+that)[\\s?!.]*$','i');
var plat='(?:facebook|instagram|whatsapp|tinder|telegram|snapchat|tiktok|linkedin|bumble|hinge|dating|social(?:\\s+media)?|online|fake|suspicious|new)';
R.profileCheck=new RegExp(pre+'(?:(?:can|could)\\s+you\\s+)?(?:check|verify|investigate|review|inspect|examine|analy[sz]e|look\\s+(?:at|into)|is|are)\\s+(?:out\\s+)?(?:(?:the|this|that|his|her|their)\\s+)?(?:'+plat+'\\s+){0,2}(?:profile|(?:this|that|his|her|their)\\s+account)\\b(?!\\s+(?:pic|picture|photo|image|dp)s?\\b)[^.?!]{0,40}[\\s?!.]*$','i');
R.caseRef=/\b(he|she|they|him|her|them|his|hers|their|theirs|it|this|that|these|those|scam\w*|fake|fraud\w*|phish\w*|suspicious|money|payment|pay|paid|send|sent|bank|profile|account|message|link|picture|photo|password|code|police|report|block|safe|safely|trust|legit|real|genuine|verify|check)\b/i;
R.generalQ=/^(?:what|who|whom|whose|when|where|why|how|which)\b|^(?:can|could|would|will|do|does|did|is|are|was|were|should)\s+\w+|^(?:tell\s+me|explain|define|write|translate|summari[sz]e|recommend|suggest|give\s+me|list|show\s+me)\b/i;
Intent.unrelated=function(t){
t=String(t||'').trim();
if(t.split(/\s+/).length<4)return false;
if(R.caseRef.test(t))return false;
return R.generalQ.test(t)||/\?\s*$/.test(t);
};
Intent.isThanks=function(t){
t=String(t||'').trim();
if(t.length>60||/\?/.test(t))return false;
if(!/\b(thanks?|thank\s*(you|u)|thx|ty|tysm|appreciate\s+(it|that|you)|cheers)\b/i.test(t))return false;
if(/\b(but|however|also|another|one\s+more|what|how|why|can\s+you|could\s+you|please\s+(check|help)|he|she|they)\b/i.test(t))return false;
return !R.url.test(t);
};

function historyFor(note){
var src=JSON.parse(JSON.stringify(S.cur.api.slice(-16))),arr=[];
src.forEach(function(m){
var p=arr[arr.length-1];
if(p&&p.role===m.role){
if(typeof p.content==='string'&&typeof m.content==='string'){if(p.role==='user'&&p.content.length<=80){p.content=m.content}else if(p.content!==m.content)p.content+='\n\n'+m.content}
else p.content=m.content;
return}
arr.push(m)});
while(arr.length&&arr[0].role!=='user')arr.shift();
var last=arr[arr.length-1];
if(last&&last.role==='user'&&note){
if(typeof last.content==='string')last.content+=note;

}

function emergencyStart(key){

{k:'unexpected',w:1,label:'Unexpected payment',re:/(you('ve| have)? won|prize|lottery|inheritance|compensation|unexpected|claim your|grant\b|refund (is|has)|overpaid|overpayment|someone (sent|deposited))/i,find:'It involves money or a reward you didn’t expect.',why:'Unexpected rewards that ask you to pay something first are a common pattern in payment scams.',next:'Contact the company or organisation using details you find yourself, not ones in the message.'},
{k:'secrecy',w:2,label:'Secrecy',re:/(don'?t tell|do not tell|keep (it )?(a )?secret|between us|confidential|tell no one|don'?t mention)/i,find:'It asks you to keep this private.',why:'Secrecy cuts you off from people who could give you a second opinion.',next:'Tell someone you trust about this request, even if you were asked not to.'},
{k:'method',w:2,label:'Unusual payment method',re:/(gift ?cards?|itunes|steam card|google play|bitcoin|\bbtc\b|\busdt\b|crypto|western union|moneygram|cash ?app|zelle|vouchers?|airtime|(send|pay|transfer)\w*\s+(it\s+)?to\s+(my|a)\s+(friend|brother|sister|cousin|agent|manager|personal)|different account|third[- ]party account)/i,find:'The way they want to be paid is unusual.',why:'Gift cards, crypto, and payments to a third person are hard to trace or reverse.',next:'Be careful with any payment that can’t be reversed. Ask your bank before sending.'},
{k:'payfirst',w:2,label:'Payment before receiving something',re:/((pay|send|transfer|deposit)\b[^.?!]{0,50}\b(first|before|upfront|in advance)\b|\b(processing|clearing|clearance|customs|registration|release|activation|insurance|delivery|shipping|unlock|withdrawal|tax)\s+(fee|charge|payment|tax)s?\b|\bfee\b[^.?!]{0,30}\bto (receive|release|claim|unlock|get|withdraw|clear))/i,find:'You’re asked to pay before you get what was promised.',why:'Paying a “fee” to unlock a prize, parcel, loan, or job is a common pattern. Genuine services rarely work this way.',next:'Don’t pay a fee to receive something. Check with the real company directly.'},
{k:'codes',w:3,label:'Request for a code or password',re:/(password|\botp\b|verification code|one[- ]time (code|pin)|\bpin\b|\bcvv\b|\bbvn\b|\bnin\b|card number|login details|security code|code (that|which) (was|i) sent|\b\d[- ]digit code)/i,find:'It asks for a code, password, or private detail.',why:'Codes and passwords can give someone control of your account. A real bank or service won’t ask you to read them out.',next:'Don’t share any code or password. If you already did, use “I think I’ve been scammed” for the next steps.'},
{k:'invest',w:2,label:'Investment claims that sound too good',re:/(guaranteed (profit|returns?|income)|double your (money|investment)|\d{2,}% (daily|weekly|monthly|return|profit)|risk[- ]free|no risk|insider (tip|info)|can'?t lose|passive income|quick (profit|returns?)|(forex|crypto|trading)\b[^.?!]{0,60}\b(guarantee|daily|weekly|profit))/i,find:'It makes big promises about investment returns.',why:'Real investments carry risk. Guaranteed or very fast returns are a common warning sign.',next:'Check whether the platform is registered with your country’s financial regulator before putting money in.'}
];
var AMOUNT_RE=/((₦|ngn)\s?\d[\d,]*(\.\d+)?\s?(k|m|million|thousand)?|\$\s?\d[\d,]*(\.\d+)?|£\s?\d[\d,]*|€\s?\d[\d,]*|\d[\d,]*\s?(naira|dollars|usd|ngn)\b)/i;
function analyzeMoney(text){
var t=String(text||'').trim(),sig=[],score=0;
MONEY_SIGNS.forEach(function(s){var m=t.match(s.re);if(m){sig.push({k:s.k,label:s.label,find:s.find,why:s.why,next:s.next,quote:m[0].trim().slice(0,60)});score+=s.w}});
var am=t.match(AMOUNT_RE);
var level=t.length<12?'unknown':(score>=4?'high':(score>=1?'some':'low'));
return{level:level,score:score,signals:sig,amount:am?am[0].trim():'',text:t,at:new Date(),basic:true};
}
var MONEY_LEVELS={
high:{name:'High concern',color:'#EF4444',text:'This request has several warning signs. I’d pause before sending anything.'},
some:{name:'Some warning signs',color:'#F59E0B',text:'This request has some warning signs. I’d slow down and check before paying.'},
low:{name:'Low concern',color:'#10A37F',text:'I didn’t spot common warning signs in what you shared. That doesn’t mean it’s safe, so only pay people and businesses you’ve verified yourself.'},
unknown:{name:'Not enough information yet',color:'#64748B',text:'I don’t have enough to go on yet. Tell me who is asking, how much, what it’s for, and how they want to be paid.'}
};
function moneySummaryLine(r){return 'Money Check: '+MONEY_LEVELS[r.level].name.toLowerCase()+(r.signals.length?'. Signs: '+r.signals.map(function(s){return s.label.toLowerCase()}).join(', '):'')+'.'}

var AUTH_STEPS=['Reading the file','Looking at built-in details (metadata)','Checking for content credentials','Looking for editing-software marks','Putting the result together'];
var COMMON_NOT=['Who is in the picture, or whether they own the account that used it.','Whether the person you’re talking to is honest.'];
var AUTH_CATS={
ai_strong:{label:'Strong signs of AI generation',color:'#EF4444',icon:'sparkles',summary:'The file carries marks that point to an AI image tool. That is a strong sign, not proof.',not:['That the person on the account made the picture, or knew it was AI.','That it was made to deceive. Many people share AI art openly.','That every part of the picture is AI-made.'],sample:['The file’s built-in details name an AI image tool.','Generation settings are stored in the file.','The picture size is common for AI image tools (weak hint).']},
ai_edit:{label:'Possible AI editing',color:'#F59E0B',icon:'sparkles',summary:'Some marks suggest AI tools may have changed part of this picture.',not:['That the whole picture is AI-made.','That the changes were meant to mislead.','How much of the picture was changed.'],sample:['The file mentions an AI-assisted editing feature.','It also passed through photo editing software.']},
conv:{label:'Signs of conventional editing',color:'#0EA5E9',icon:'flask',summary:'The file shows it passed through photo editing software.',not:['That the picture is fake or misleading. Most pictures are edited a little, like cropping or colour.','What was changed.'],sample:['The file names photo editing software.','Content credentials are present and show an editing step.']},
none:{label:'No strong synthetic signals detected',color:'#10A37F',icon:'shield-check',summary:'The checks in this demo didn’t find strong signs of AI or editing.',not:['That the picture is real or untouched.','That a full AI detector would agree. This demo doesn’t run one.','That the picture hasn’t been used elsewhere.'],sample:['Camera-style details are stored in the file.','No AI or editing-software marks were found.']},
unknown:{label:'Not enough information',color:'#64748B',icon:'help-circle',summary:'This file doesn’t carry enough built-in details to say much either way.',not:['That the picture is real.','That the picture is fake.'],sample:['No camera or editing details were found. This is common for screenshots and pictures saved from social apps.','The file is small or heavily compressed.']}
};
async function analyzeMeta(file,url){
var buf=await file.arrayBuffer(),u=new Uint8Array(buf);
function str(a){var o='',c=8192;for(var i=0;i<a.length;i+=c)o+=String.fromCharCode.apply(null,a.subarray(i,i+c));return o}
var txt=str(u.subarray(0,Math.min(u.length,300000)))+(u.length>300000?str(u.subarray(Math.max(300000,u.length-60000))):'');
var low=txt.toLowerCase();
function has(a){return a.filter(function(k){return low.indexOf(k)>-1})}
var ai=has(['trainedalgorithmicmedia','midjourney','dall-e','stable diffusion','comfyui','automatic1111','novelai']);
if(low.indexOf('sampler:')>-1&&low.indexOf('steps:')>-1)ai.push('generation settings');
var aiEdit=has(['compositewithtrainedalgorithmicmedia','generative fill','adobe firefly','firefly']);
var conv=has(['photoshop','lightroom','gimp','snapseed','pixelmator','affinity photo','canva','picsart','facetune','meitu','capture one']);
var c2pa=low.indexOf('c2pa')>-1||low.indexOf('jumbf')>-1;
var exif=txt.indexOf('Exif\u0000\u0000')>-1;
var dims=await new Promise(function(r){var im=new Image();im.onload=function(){r([im.naturalWidth,im.naturalHeight])};im.onerror=function(){r(null)};im.src=url});
var found=[],cat;
found.push('File: '+esc(file.type||'image')+', '+(file.size/1048576).toFixed(2)+' MB'+(dims?', '+dims[0]+'×'+dims[1]+' pixels':'')+'.');
if(ai.length)found.push('The file’s built-in details mention an AI image tool or its settings ('+esc(ai.join(', '))+'). Anyone can add or remove these labels.');
if(aiEdit.length)found.push('The file mentions an AI-assisted editing feature ('+esc(aiEdit.join(', '))+').');
if(conv.length)found.push('The file names photo editing software ('+esc(conv.join(', '))+').');
if(c2pa)found.push('Content credentials (C2PA) data is present. These record how a picture was made or edited, and can be removed.');
if(exif)found.push('Camera-style metadata is present.');
if(!exif&&!c2pa&&!ai.length&&!aiEdit.length&&!conv.length)found.push('No camera or editing details were found. Screenshots and pictures saved from social apps usually have them stripped.');
if(dims&&dims[0]===dims[1]&&[512,768,1024,1536,2048].indexOf(dims[0])>-1)found.push('The size ('+dims[0]+'×'+dims[1]+') is common for some AI image tools. Many ordinary pictures are cropped square too, so this is a weak hint at most.');
if(ai.length)cat='ai_strong';else if(aiEdit.length)cat='ai_edit';else if(conv.length)cat='conv';else if(exif||c2pa)cat='none';else cat='unknown';
return{cat:cat,found:found,name:file.name,at:new Date(),demo:true};
}

var ITEM_TYPES={message:{label:'Message',icon:'message-circle',ph:'Paste a message they sent you'},picture:{label:'Picture',icon:'photo',ph:''},link:{label:'Link',icon:'link',ph:'Paste a link'},profile:{label:'Profile info',icon:'id',ph:'What you can see on their profile: name, bio, anything odd'},payment:{label:'Payment request',icon:'coin',ph:'What are they asking you to pay, and how?'},note:{label:'Note',icon:'file-text',ph:'Write your own note'},analysis:{label:'Analysis',icon:'shield-check',ph:''}};
var SRC_TAG={user:'<span class="tag" style="background:#102A5C;color:#9DBBFF">YOU PROVIDED</span>',ai:'<span class="tag" style="background:#0B3A36;color:#3DF0D0">SCAMSENSE ANALYSIS</span>',demo:'<span class="tag">DEMO RESULT</span>'};
function mkItem(type,source,title,detail,extra){return Object.assign({id:'i'+Math.random().toString(36).slice(2,8),type:type,source:source,title:title,detail:detail||'',ts:new Date()},extra||{})}
function curCase(){return S.cases.filter(function(c){return c.id===S.caseId})[0]||null}
function cleanTitle(t){return String(t||'').trim().replace(/^case:\s*/i,'')||'Untitled case'}
function makeCase(title){var c={id:'C'+Date.now().toString(36),title:cleanTitle(title),created:new Date(),items:[]};S.cases.push(c);S.caseId=c.id;return c}
function attach(items){
if(!S.cases.length){S.pendingItems=items;S.f['case.title']='';go('case_new');return}
if(S.cases.length===1){var c=S.cases[0];c.items=c.items.concat(items);S.caseId=c.id;S.flash='Added to this case.';go('case');return}
S.pendingItems=items;go('case_pick');
}
function caseConnections(c){
var it=c.items,out=[],n=function(x){return '#'+(it.indexOf(x)+1)};
var pics=it.filter(function(x){return x.type==='picture'}),seen={};
for(var i=0;i<pics.length;i++){
if(seen[pics[i].id])continue;
var grp=[pics[i]];
for(var j=i+1;j<pics.length;j++){if(pics[i].hash&&(pics[i].hash===pics[j].hash||ham(pics[i].hash,pics[j].hash)<=4)){grp.push(pics[j]);seen[pics[j].id]=1}}
if(grp.length>1)out.push({text:'The same picture was uploaded in this case.',basis:'Based on items '+grp.map(n).join(', ')+'. Compared on this device. Pictures can look alike without being the same.'});
}
var moveRe=Rules[5].re,secRe=Rules[3].re;
var moves=it.filter(function(x){return x.source==='user'&&['message','note','profile','link'].indexOf(x.type)>-1&&moveRe.test(x.detail)});
var pays=it.filter(function(x){return x.source==='user'&&x.type==='payment'});
if(moves.length&&pays.length){
var m=moves[0],p=pays.filter(function(x){return it.indexOf(x)>it.indexOf(m)})[0];
out.push(p?{text:'The person requested money after asking you to move the conversation elsewhere.',basis:'Based on items '+n(m)+' and '+n(p)+', in the order you added them.'}:{text:'A payment request and a request to move the conversation elsewhere both appear in this case.',basis:'Based on items '+n(m)+' and '+n(pays[0])+'.'});
}
var secrets=it.filter(function(x){return x.source==='user'&&['message','note','payment'].indexOf(x.type)>-1&&secRe.test(x.detail)});
if(secrets.length&&pays.length)out.push({text:'Someone asked for secrecy and a payment was requested in the same case.',basis:'Based on items '+n(secrets[0])+' and '+n(pays[0])+'.'});
var hi=it.filter(function(x){return x.kind==='money'&&(x.level==='high'||x.level==='some')});
if(hi.length)out.push({text:'A Money Check found '+(hi[0].level==='high'?'high concern':'some warning signs')+' in a payment request.',basis:'Based on item '+n(hi[0])+'. This was a basic pattern check, not a verdict.'});
var tr=it.filter(function(x){return x.kind==='trace'});
if(tr.length)out.push({text:'An image trace was run. The results are demo placeholders, not real matches.',basis:'Based on item '+n(tr[0])+'.'});
var au=it.filter(function(x){return x.kind==='auth'});
if(au.length)out.push({text:'A picture authenticity check was run on this device. It reads file details only and is not proof either way.',basis:'Based on item '+n(au[0])+'.'});
var ve=it.filter(function(x){return x.kind==='verify'});
if(ve.length)out.push({text:'A verification check is part of this case. “Live person detected” is not the same as “Identity confirmed.”',basis:'Based on item '+n(ve[0])+'. Demo result.'});
return out;
}

Views.verify=function(){

known:function(){

return h+prim('Check before paying','fw-run')+'<div class="rs" style="text-align:center">Basic check on this device. I can’t see any account, bank record, or the other person.</div>';

function tcSections(raw){

String(raw||'').split('\n').forEach(function(l){
var h=l.match(/^\s*\*\*([^*]+)\*\*\s*:?\s*$/);

cur=(k.indexOf('what you told me')===0||k.indexOf('the situation')===0)?'told':k.indexOf('claims made')===0?'claims':k.indexOf('evidence you gave')===0?'evid':(k.indexOf('why')===0||k.indexOf('warning signs')===0)?'signs':k.indexOf('how it fits')===0?'analysis':(k.indexOf("what we don't know")===0||k.indexOf("what i don't know")===0||k.indexOf('what we do not know')===0)?'unk':k.indexOf('what to do now')===0?'next':null;return}
var b=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
if(cur&&b){var t=b[1].replace(/\*\*|`/g,'').trim();if(t)out[cur].push(t)}else if(cur==='told'&&l.trim()&&!/^\s*\*\*/.test(l)){out.told.push(l.replace(/\*\*|`/g,'').trim())}
});
return out;
}

/* =====================================================================

   photo, website, money request, something else) instead of one message.
   Everything here runs on this device. It does not search the web, run
   picture searches, or verify anyone. The AI reads only what the person
   shared, and the result separates what they told us, the AI's analysis,
   possible matches (none yet), and what is unknown.
   ===================================================================== */

   NOT PROVE > STATUS. The AI fills it only from what the person shared.

var EvidenceChain={
ST:{verified:['VERIFIED','ec-verified'],partial:['PARTIALLY SUPPORTED','ec-partial'],unverified:['UNVERIFIED','ec-unverified'],conflict:['CONFLICTING','ec-conflict'],unknown:['UNKNOWN','ec-unknown']},

if(/partial|some support/.test(k))return 'partial';
if(/conflict|contradict/.test(k))return 'conflict';
if(/verif|confirm/.test(k))return /(confirm|verif|checked|phoned|called|official|spoke to|spoke with)/i.test(said||'')?'verified':'unverified';

},
parse:function(raw,userText){
if(!raw)return null;

String(raw).split(';;').forEach(function(part){
var f=part.split('|');

/* =====================================================================

/* =====================================================================
   PROOFCHECK (part 5): "Is This Proof Really Proof?"
   Helps a person examine a screenshot, receipt, invoice, certificate,
   message, profile or other material that someone is using as "proof".
   Everything here runs on this device. It does NOT run a reverse image
   search, a forensic scan, or any lookup with a bank, issuer or platform.
   It never calls anything fake. It keeps four things apart:
   FACT (seen directly), AI ANALYSIS (ScamSense's reading, can be wrong),
   POSSIBLE MATCH (similar to something else, not confirmation) and
   UNKNOWN (cannot be checked from here).
   ===================================================================== */

function pfTag(k){var n={FACT:'FACT',AI:'AI ANALYSIS',MATCH:'POSSIBLE MATCH',UNK:'UNKNOWN'};return '<span class="pf-t pf-'+k+'">'+n[k]+'</span>'}
function pfRow(k,h){return '<div class="pf-r">'+pfTag(k)+'<div>'+h+'</div></div>'}
function pfClip(s,n){s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s}
function pfPlain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,'\'')}
function pfDigits(a){return String(a).replace(/\D/g,'').replace(/^0+/,'')}
function pfAmounts(t){var m=String(t||'').match(new RegExp(AMOUNT_RE.source,'gi'))||[],seen={},out=[];m.forEach(function(x){var d=pfDigits(x);if(d&&!seen[d]){seen[d]=1;out.push(x.trim())}});return out}

/* ----- the check itself: only reads what the person gave, plus things saved inside this app ----- */
async function pfAnalyze(P){
var N=P.in,T=PF_TYPES[N.type]||PF_TYPES.other,meta=null;
if(P.img){
try{meta=await analyzeMeta(P.img.file,P.img.url)}catch(e){meta=null}
if(!P.img.hash){try{P.img.hash=await dHash(P.img.url)}catch(e){}}
}
var told=[N.claim,N.source].filter(Boolean).join(' . '),facts=[],reading=[],signs=[],matches=[],unk=[],next=[];
/* FACT: what was directly given */
if(N.claim)facts.push('You told me it is being used to show: “'+esc(pfClip(N.claim,200))+'”.');
if(N.source)facts.push('You told me it came from: “'+esc(pfClip(N.source,200))+'”.');
if(N.text)facts.push('You pasted '+N.text.length+' characters of text from it.');
if(P.img){facts.push('You added one picture.');if(meta&&meta.found)meta.found.forEach(function(f){facts.push(f)})}
var amT=pfAmounts(N.text),amC=pfAmounts(N.claim);
if(amT.length)facts.push('Amounts that appear in the text: '+esc(amT.slice(0,4).join(', '))+'.');
if(!facts.length)facts.push('You haven’t given me anything to read yet.');
/* AI ANALYSIS: ScamSense's reading */
reading.push(T.shows);
reading.push('Proof does not settle whether a request is safe. Real proof can be used in a scam, and weak proof can still be honest. What counts is whether it can be checked independently.');
if(amT.length>1)reading.push('More than one amount appears. It is worth checking which one is the real figure.');
if(P.img&&!N.text)reading.push('This device can’t read the words inside a picture. Paste the text, or use “Ask ScamSense AI”, which can read the picture but can also make mistakes.');
/* warning signs */
var seenL={};
function addSign(label,find){if(seenL[label])return;seenL[label]=1;signs.push({label:label,find:find})}
Rules.forEach(function(r){
var m=N.text.match(r.re),where='in the text you pasted';
if(!m){m=told.match(r.re);where='in what you told me'}
if(m){var l=r.label.charAt(0).toUpperCase()+r.label.slice(1);addSign(l,'The wording '+where+' includes “'+esc(m[0].trim())+'”. This often appears in scams, but it can also appear in honest messages.')}
});
T.signs.forEach(function(s){if(s.re.test(N.text)||s.re.test(told))addSign(s.label,s.find)});
if(amT.length&&amC.length){
var dT=amT.map(pfDigits),overlap=amC.some(function(a){return dT.indexOf(pfDigits(a))>-1});
if(!overlap)addSign('Amounts differ','The amount in what you told me ('+esc(amC[0])+') does not appear in the pasted text ('+esc(amT.slice(0,2).join(', '))+'). This could be a typo or a different payment, so it is worth checking.');
}
if(P.pressure==='yes')addSign('Pressure','You said they are pushing you to act quickly. Anyone with real proof should be fine with you taking time to check it.');
if(P.money==='yes')addSign('Asked to act because of it','You said you are being asked to send money or something else because of this. Proof shown during a request is a reason to check, not a reason to hurry.');
if(meta&&(meta.cat==='ai_strong'||meta.cat==='ai_edit'||meta.cat==='conv'))addSign('File details worth asking about','The file’s own details mention editing or generation tools (see the facts above). That can have an innocent explanation, like a filter, a crop or an app. It does not show the picture is fake.');
/* POSSIBLE MATCH: only comparisons against things saved in this app */
function simHash(h){return h&&P.img&&P.img.hash&&ham(h,P.img.hash)<=6}
S.cases.forEach(function(c){c.items.forEach(function(it,i){
if(matches.length>=4)return;
if(it.type==='picture'&&simHash(it.hash))matches.push('This picture looks visually similar to item #'+(i+1)+' in your case “'+esc(c.title)+'”. This is a basic comparison only. Similar is not the same as identical.');
var d=(it.detail||'')+' '+(it.title||'');
pfAmounts(N.text+' '+N.claim).forEach(function(a){if(matches.length<4&&pfDigits(a).length>=3&&pfDigits(d).indexOf(pfDigits(a))>-1&&d.toLowerCase().indexOf(a.toLowerCase().replace(/\s/g,''))>-1)matches.push('The amount “'+esc(a)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
(N.text.match(/\b\d{8,}\b/g)||[]).forEach(function(n){if(matches.length<4&&d.indexOf(n)>-1)matches.push('The number “'+esc(n)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
(N.text.match(/[\w.+-]+@[\w-]+\.[\w.]+/g)||[]).forEach(function(n){if(matches.length<4&&d.toLowerCase().indexOf(n.toLowerCase())>-1)matches.push('The address “'+esc(n)+'” also appears in item #'+(i+1)+' in your case “'+esc(c.title)+'”.')});
})});
if(matches.length<4){var seenImg=[];(S.trace.imgs||[]).forEach(function(o){seenImg.push({h:o.hash,w:'a picture you traced earlier'})});if(S.auth&&S.auth.img)seenImg.push({h:S.auth.img.hash,w:'a picture you checked for authenticity earlier'});
seenImg.forEach(function(o){if(matches.length<4&&o.h&&P.img&&P.img.hash&&ham(o.h,P.img.hash)<=6&&P.img.url!==undefined)matches.push('This picture looks visually similar to '+o.w+'. This is a basic comparison only.')})}
/* UNKNOWN */
T.verify.forEach(function(v){unk.push(esc(v))});
unk.push('Whether the person who gave you this is who they say they are.');
unk.push('Whether anything was cropped, changed or left out. We cannot verify this from the information available.');
if(!N.source)unk.push('Where it came from. You didn’t say who gave it to you or how.');
if(!N.claim)unk.push('What it is being used to show. You didn’t say.');
if(P.img&&!N.text)unk.push('What the words in the picture say. They were not read on this device.');
/* next steps */
var money=P.money==='yes'||P.money==='unsure'||['receipt','invoice','profit'].indexOf(N.type)>-1;
if(money)next.push(MoneyFirewall.SAFE);
next.push('Check it yourself, using details you find on your own, like an official site, the app on your phone, or the number on your card. Don’t use details from the proof itself.');
if(['chat','profile','certificate','other'].indexOf(N.type)>-1)next.push('Ask the person to confirm in a way that can be checked, like a live video call or a question only they could answer.');
if(signs.length>=2||P.money==='yes')next.push('Talk to your bank, or someone you trust, before you act on it.');
next.push('Keep it in a case, with where it came from and when you got it.');
var n=signs.length,lv=n>=3?'high':(n>=1?'some':((!N.text&&!N.claim)?'info':'none'));
var top=signs.slice(0,3).map(function(s){return s.label}).join(', ');
var sum='ProofCheck on a '+T.label.toLowerCase()+': '+PF_LEVELS[lv].name.toLowerCase()+(top?' ('+top+')':'')+'. Nothing was verified. It does not prove the person is telling the truth.';
return{T:T,N:N,facts:facts,reading:reading,signs:signs,matches:matches,unk:unk,next:next,level:lv,money:money,sum:sum,hasImg:!!P.img};
}

/* ----- result screen ----- */
function pfResult(){
var P=S.pf,R=P.res,L=PF_LEVELS[R.level],h='';
h+=title('ProofCheck','What this proof can and cannot tell us');
h+='<div style="border:1px solid '+L.color+';background:#0E1A3C;border-radius:16px;padding:14px;margin:0 0 12px"><div style="font-size:18px;font-weight:600;color:'+L.color+'">'+L.name+'</div><div style="margin-top:4px">'+L.text+'</div><div class="rs" style="margin-top:6px">Nothing here has been verified. We cannot verify this from the information available.</div></div>';

h+='<details class="pf-leg"><summary>How to read the labels</summary><div class="pf-lg">'+pfRow('FACT','Seen directly in what you gave me.')+pfRow('AI','ScamSense’s own reading. It can be wrong.')+pfRow('MATCH','Similar to something else. Not a confirmation.')+pfRow('UNK','Can’t be checked from here.')+'</div></details>';
h+=sect('1. What it shows');
R.facts.forEach(function(f){h+=pfRow('FACT',f)});
R.reading.forEach(function(f){h+=pfRow('AI',esc(f))});

h+=pfRow('AI','This does not prove that the person is telling the truth.');
R.T.not.forEach(function(f){h+=pfRow('AI',esc(f))});

/* Display name for posting. One load at a time per user (so two auth events can't create two default names).
   The profile is read and, only if it doesn't exist yet, created in ONE transaction, so an existing or just-claimed
   username is never overwritten. Errors are kept in CM.nameErr (not hidden) and the caller can retry. */
function loadProfile(){var u=uid();if(!u)return Promise.resolve('');
if(CM._np&&CM._npU===u)return CM._np;
CM._npU=u;CM.nameSt='loading';CM.nameErr='';
var p=FS().then(function(f){var F=f.F,ref=F.doc(f.db,'users',u,'communityProfile','main');
return F.runTransaction(f.db,function(tx){return tx.get(ref).then(function(d){var n=d.exists()&&d.data().displayName?String(d.data().displayName):'';
if(n||ScamSenseAuth._claiming)return n;
n='Member'+(1000+Math.floor(Math.random()*9000));tx.set(ref,{displayName:n});return n})})})
.then(function(n){if(uid()!==u)return '';
if(n){CM.name=n;CM.nameU=u;CM.nameSt='ok'}else CM.nameSt='idle';
if(n){if(/^cm_(home|feed)$/.test(S.view))soft();else if(/^cm_/.test(S.view)&&S.view!=='cm_create')render();if(compIsOpen())compSync()}
return n})
.catch(function(e){if(uid()===u){CM.nameSt='error';CM.nameErr=why(e)}return ''})
.then(function(n){if(CM._np===p){CM._np=null}return n});
CM._np=p;return p}
/* Used by publish() and comment(): resolves with the display name, or '' if it can't be loaded right now. */
function needName(){if(CM.name)return Promise.resolve(CM.name);var u=uid();return loadProfile().then(function(n){return uid()===u?(n||CM.name||''):''})}

<script>
/* Screen transitions + stable navigation.

   - Tapping the tab you are already on scrolls to the top instead of re-rendering. */
try{(function(){
var root=document.documentElement,mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;

function key(){var v=S.view,c=C();if(v==='cm_profile')return mineProf()?v+':'+(me()?'self':'preview'):v+':'+c.prof.uid;return v}

render=function(){
var m=document.getElementById('main'),v=S.view,k=key(),was=lastKey,wv=lastView,top=m?m.scrollTop:0,fromSlot=wv?slot(wv):-1;

else{
 var back=wv==='cm_post'||wv==='cm_people',tab=/^cm_(home|feed|notif)$/.test(v)||(v==='cm_profile'&&mineProf());
 if(v!=='chat'&&(tab||back)&&mem[k]!=null)m.scrollTop=mem[k];
